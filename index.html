<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Barber Agenda — Agendamento</title>
<link rel="icon" id="favicon-link" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141210;
    --bg-panel:#1c1917;
    --bg-panel-2:#242019;
    --line:#3a332a;
    --gold:#c9a227;
    --gold-light:#e6c866;
    --white:#f5f1e8;
    --muted:#948a78;
    --red:#a13a3a;
    --green:#5c8a5c;
    --radius:14px;
    --serif:'Cormorant Garamond', serif;
    --display:'Bebas Neue', sans-serif;
    --sans:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .stripe{
    height:6px;
    background:repeating-linear-gradient(-45deg, var(--gold) 0 10px, var(--white) 10px 20px, #1a1a1a 20px 30px);
    opacity:.85;
  }
  .wrap{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg);}
  header.brand{padding:28px 20px 20px; text-align:center; border-bottom:1px solid var(--line);}
  header.brand img{width:64px; height:64px; margin-bottom:10px;}
  header.brand .eyebrow{font-family:var(--serif); letter-spacing:.35em; font-size:11px; color:var(--gold); text-transform:uppercase;}
  header.brand h1{font-family:var(--display); font-size:34px; letter-spacing:.03em; color:var(--white); line-height:1;}
  header.brand h1 span{color:var(--gold);}
  header.brand .sub{font-family:var(--serif); font-style:italic; font-size:15px; color:var(--muted); letter-spacing:.15em; text-transform:uppercase; margin-top:2px;}

  .steps{display:flex; justify-content:center; gap:6px; padding:16px 20px 0;}
  .step-dot{flex:1; max-width:64px; height:3px; border-radius:3px; background:var(--line); transition:background .3s;}
  .step-dot.active{background:var(--gold);}
  .step-dot.done{background:var(--gold-light);}

  main{flex:1; padding:20px; padding-bottom:100px;}
  .step-title{font-family:var(--serif); font-size:13px; letter-spacing:.25em; text-transform:uppercase; color:var(--muted); margin-bottom:4px;}
  .step-heading{font-family:var(--display); font-size:26px; letter-spacing:.02em; margin-bottom:18px;}

  .card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    transition:border-color .15s, transform .1s;
  }
  .svc-card{display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .svc-card:active{transform:scale(.98);}
  .svc-card.selected{border-color:var(--gold); background:var(--bg-panel-2);}
  .svc-name{font-weight:600; font-size:16px;}
  .svc-meta{color:var(--muted); font-size:13px; margin-top:2px;}
  .svc-price{font-family:var(--display); font-size:20px; color:var(--gold-light); letter-spacing:.02em;}

  .empty-state{text-align:center; padding:40px 20px; color:var(--muted);}
  .empty-state .glyph{font-size:28px; margin-bottom:8px; display:block;}

  input[type=date], .date-input{
    width:100%; padding:14px; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:var(--radius); color:var(--white); font-size:16px; font-family:var(--sans);
  }
  .date-quickpicks{display:flex; gap:8px; margin-top:12px; overflow-x:auto; padding-bottom:4px;}
  .day-chip{
    flex:0 0 auto; min-width:56px; text-align:center; padding:10px 6px; border-radius:10px;
    background:var(--bg-panel); border:1px solid var(--line); cursor:pointer; font-size:12px;
  }
  .day-chip .dow{color:var(--muted); text-transform:uppercase; font-size:10px; letter-spacing:.05em;}
  .day-chip .num{font-family:var(--display); font-size:20px; margin-top:2px;}
  .day-chip.selected{border-color:var(--gold); background:var(--bg-panel-2);}
  .day-chip.disabled{opacity:.35; pointer-events:none;}

  .time-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .time-slot{
    padding:12px 4px; text-align:center; border-radius:10px; background:var(--bg-panel);
    border:1px solid var(--line); cursor:pointer; font-weight:600; font-size:15px;
  }
  .time-slot.selected{border-color:var(--gold); background:var(--gold); color:#141210;}

  label.field-label{display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px;}
  input[type=text], input[type=tel], textarea{
    width:100%; padding:14px; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:var(--radius); color:var(--white); font-size:16px; font-family:var(--sans);
  }
  input:focus, textarea:focus{outline:none; border-color:var(--gold);}

  .summary-box{background:var(--bg-panel-2); border:1px solid var(--gold); border-radius:var(--radius); padding:16px; margin-top:16px;}
  .summary-row{display:flex; justify-content:space-between; font-size:14px; padding:4px 0; color:var(--muted);}
  .summary-row strong{color:var(--white); font-weight:600;}

  .bottom-bar{
    position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto;
    background:linear-gradient(0deg, var(--bg) 60%, transparent); padding:20px; padding-top:36px;
  }
  .btn{
    display:block; width:100%; text-align:center; padding:16px; border-radius:var(--radius);
    font-family:var(--display); font-size:18px; letter-spacing:.05em; border:none; cursor:pointer;
  }
  .btn-primary{background:var(--gold); color:#141210;}
  .btn-primary:disabled{background:var(--line); color:var(--muted); cursor:not-allowed;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--white); margin-top:8px;}
  .btn-link{background:none; border:none; color:var(--gold); font-family:var(--sans); font-size:13px; text-decoration:underline; cursor:pointer;}
  .back-row{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .back-btn{color:var(--gold); font-size:14px; cursor:pointer; background:none; border:none;}

  .confirm-screen{text-align:center; padding:40px 20px;}
  .confirm-screen .glyph{font-size:48px; color:var(--gold);}
  .confirm-screen h2{font-family:var(--display); font-size:28px; margin:12px 0 6px;}
  .confirm-screen p{color:var(--muted); font-size:14px; line-height:1.5;}

  footer.foot{text-align:center; padding:16px; color:var(--muted); font-size:11px;}
  footer.foot button{background:none; border:none; color:var(--muted); font-size:11px; text-decoration:underline; cursor:pointer;}

  /* ---------- ADMIN ---------- */
  .admin-wrap{max-width:720px;}
  .login-box{max-width:360px; margin:80px auto; padding:0 20px;}
  .login-box h2{font-family:var(--display); font-size:28px; text-align:center; margin-bottom:20px;}
  .admin-header{display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--line);}
  .admin-header h1{font-family:var(--display); font-size:22px;}
  .logout-btn{color:var(--muted); font-size:12px; background:none; border:none; text-decoration:underline; cursor:pointer;}
  .tabs{display:flex; gap:4px; padding:12px 16px 0; overflow-x:auto;}
  .tab{padding:10px 14px; font-size:13px; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; font-weight:600;}
  .tab.active{color:var(--gold); border-color:var(--gold);}
  .tab-panel{padding:16px 20px 60px; display:none;}
  .tab-panel.active{display:block;}

  .appt-card{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .appt-time{font-family:var(--display); font-size:20px; color:var(--gold-light); min-width:56px;}
  .appt-info{flex:1;}
  .appt-info .name{font-weight:600;}
  .appt-info .meta{color:var(--muted); font-size:12px; margin-top:2px;}
  .badge{font-size:10px; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
  .badge.agendado{background:#3a3320; color:var(--gold-light);}
  .badge.concluido{background:#243a24; color:var(--green);}
  .badge.cancelado{background:#3a2424; color:var(--red);}
  .appt-actions{display:flex; gap:6px;}
  .icon-btn{padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg-panel-2); color:var(--white); font-size:12px; cursor:pointer;}
  .icon-btn.danger{border-color:var(--red); color:#e08a8a;}
  .icon-btn.ok{border-color:var(--green); color:#9ed49e;}

  .earnings-total{text-align:center; padding:24px 0;}
  .earnings-total .big{font-family:var(--display); font-size:44px; color:var(--gold-light);}
  .earnings-total .lbl{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.1em;}
  .period-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .period-tabs button{flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg-panel); color:var(--muted); font-size:13px; cursor:pointer;}
  .period-tabs button.active{border-color:var(--gold); color:var(--gold);}

  .svc-row, .hour-row, .block-row{display:flex; align-items:center; gap:10px; justify-content:space-between;}
  .hour-row{padding:10px 0; border-bottom:1px solid var(--line);}
  .hour-row .dow-label{width:80px; font-weight:600; font-size:14px;}
  .hour-row input[type=time]{background:var(--bg-panel-2); border:1px solid var(--line); color:var(--white); border-radius:8px; padding:8px; font-size:13px;}
  .hour-row label.closed-toggle{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted);}

  .form-inline{display:flex; gap:8px; margin-top:10px;}
  .form-inline input{flex:1;}
  .small-btn{padding:12px 16px; border-radius:10px; background:var(--gold); color:#141210; border:none; font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--gold); color:#141210;
    padding:12px 20px; border-radius:10px; font-weight:600; font-size:14px; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast-root"></div>

<script type="module">
/* =========================================================================
   BARBER AGENDA — Sistema de Agendamento (SaaS para barbearias)
   Firebase Firestore + Auth. Config abaixo: cole as chaves do seu projeto.
   ========================================================================= */

// ---------- CONFIGURAÇÃO FIREBASE (cole aqui suas chaves) ----------
const firebaseConfig = {
  apiKey: "AIzaSyAxdSvWBLfbTunb-8lW0hUY1D9OIQLX71g",
  authDomain: "barber-agenda-53c9d.firebaseapp.com",
  projectId: "barber-agenda-53c9d",
  storageBucket: "barber-agenda-53c9d.firebasestorage.app",
  messagingSenderId: "167143504123",
  appId: "1:167143504123:web:ea2ff6554a8db9e78cd85e"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc,
  query, where, orderBy, onSnapshot, writeBatch, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const DEFAULT_LOGO_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <pattern id="stripes" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#141210"/>
      <rect width="6" height="12" fill="#c9a227"/>
    </pattern>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#1c1917" stroke="#c9a227" stroke-width="3"/>
  <circle cx="50" cy="50" r="33" fill="url(#stripes)" stroke="#f5f1e8" stroke-width="2"/>
</svg>
`.trim());

// ---------- CONSTANTES ----------
const DOW_KEYS = ['dom','seg','ter','qua','qui','sex','sab'];
const DOW_LABELS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DEFAULT_HOURS = DOW_KEYS.reduce((acc,k)=>{ acc[k] = {open:"09:00", close:"19:00", closed:false}; return acc; }, {});
const SLOT_STEP = 30; // minutos

// ---------- HELPERS ----------
const $ = (sel, ctx=document) => ctx.querySelector(sel);
const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html!==undefined) e.innerHTML = html; return e; };
const pad = n => String(n).padStart(2,'0');
const toDateStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromDateStr = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const timeToMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const minToTime = min => `${pad(Math.floor(min/60))}:${pad(min%60)}`;
const money = v => v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const showToast = msg => {
  const root = $('#toast-root'); root.innerHTML = '';
  const t = el('div','toast', msg); root.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2600);
};
function fileToCompressedDataURL(file, maxSize=320, quality=0.85){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
        else{ if(h > maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png', quality));
      };
      img.onerror = () => reject(new Error('invalid image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}
const phoneMask = v => {
  v = v.replace(/\D/g,'').slice(0,11);
  if(v.length > 6) return `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
  if(v.length > 2) return `(${v.slice(0,2)}) ${v.slice(2)}`;
  return v;
};

// ---------- ESTADO ----------
const state = {
  route: location.hash.includes('admin') ? 'admin' : 'client',
  services: [],
  config: { hours: DEFAULT_HOURS, blockedDates: [], businessName: 'Barber Agenda', logo: null },
  booking: { service:null, date:null, time:null, name:'', phone:'', note:'' },
  admin: { user:null, tab:'agendamentos', dayAppointments:[], selectedDate: toDateStr(new Date()), earningsPeriod:'hoje', services:[], blockedDates:[], blockedSlots:[] }
};

window.addEventListener('hashchange', ()=>{
  state.route = location.hash.includes('admin') ? 'admin' : 'client';
  render();
});

// ---------- FIRESTORE: leitura pública ----------
onSnapshot(collection(db,'services'), snap=>{
  state.services = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.order??0)-(b.order??0));
  if(state.route==='client') render();
  if(state.route==='admin') renderAdminServicesIfActive();
});

onSnapshot(doc(db,'config','business'), snap=>{
  if(snap.exists()){
    const data = snap.data();
    state.config.hours = { ...DEFAULT_HOURS, ...(data.hours||{}) };
    state.config.blockedDates = data.blockedDates || [];
    state.config.businessName = data.businessName || 'Barber Agenda';
    state.config.logo = data.logo || null;
  }
  document.title = `${state.config.businessName} — Agendamento`;
  const favicon = $('#favicon-link');
  if(favicon) favicon.href = state.config.logo || DEFAULT_LOGO_SVG;
  if(state.route==='client') render();
  if(state.route==='admin'){ renderAdminHoursIfActive(); if(state.admin.user) $('.admin-header h1') && ($('.admin-header h1').textContent = `${state.config.businessName} — Painel`); }
});

// ---------- DISPONIBILIDADE ----------
async function getAvailableTimes(dateStr, duration){
  const d = fromDateStr(dateStr);
  const dow = DOW_KEYS[d.getDay()];
  const hours = state.config.hours[dow];
  if(!hours || hours.closed) return [];
  if(state.config.blockedDates.includes(dateStr)) return [];

  const openMin = timeToMin(hours.open);
  const closeMin = timeToMin(hours.close);

  // horários ocupados por agendamentos existentes (via coleção pública 'slots')
  const slotsSnap = await getDocs(query(collection(db,'slots'), where('date','==', dateStr)));
  const busyRanges = slotsSnap.docs.map(d=>{
    const s = d.data();
    const start = timeToMin(s.time);
    return [start, start + (s.duration||30)];
  });

  // horários bloqueados manualmente pelo admin
  const blockedSnap = await getDocs(query(collection(db,'blockedSlots'), where('date','==', dateStr)));
  const blockedTimes = new Set(blockedSnap.docs.map(d=>d.data().time));

  const now = new Date();
  const isToday = dateStr === toDateStr(now);
  const nowMin = now.getHours()*60 + now.getMinutes() + 30; // buffer de 30min

  const slots = [];
  for(let t=openMin; t + duration <= closeMin; t += SLOT_STEP){
    const time = minToTime(t);
    if(blockedTimes.has(time)) continue;
    if(isToday && t < nowMin) continue;
    const overlaps = busyRanges.some(([s,e]) => t < e && (t+duration) > s);
    if(overlaps) continue;
    slots.push(time);
  }
  return slots;
}

// ==========================================================================
// RENDER — CLIENTE
// ==========================================================================
let clientStep = 1; // 1 serviço, 2 data, 3 horário, 4 dados, 5 sucesso

function renderClient(){
  const root = $('#app');
  root.innerHTML = '';
  const wrap = el('div','wrap');

  const header = el('header','brand');
  header.innerHTML = `
    <img src="${state.config.logo || DEFAULT_LOGO_SVG}" alt="${state.config.businessName}">
    <div class="eyebrow">Agendamento Online</div>
    <h1>${state.config.businessName}</h1>
    <div class="sub">Reserve seu horário</div>`;
  wrap.appendChild(header);

  if(clientStep <= 4){
    const steps = el('div','steps');
    for(let i=1;i<=4;i++){
      const dot = el('div', `step-dot ${i<clientStep?'done':i===clientStep?'active':''}`);
      steps.appendChild(dot);
    }
    wrap.appendChild(steps);
  }

  const main = el('main');
  if(clientStep===1) renderStepService(main);
  else if(clientStep===2) renderStepDate(main);
  else if(clientStep===3) renderStepTime(main);
  else if(clientStep===4) renderStepIdentify(main);
  else if(clientStep===5) renderStepDone(main);
  wrap.appendChild(main);

  const foot = el('footer','foot', `${state.config.businessName} &middot; <button id="admin-link">Área administrativa</button>`);
  wrap.appendChild(foot);

  root.appendChild(wrap);
  const stripe = el('div','stripe'); root.insertBefore(stripe, wrap);

  $('#admin-link')?.addEventListener('click', ()=>{ location.hash = '#admin'; });
}

function renderStepService(main){
  main.appendChild(el('div','step-title','Passo 1 de 4'));
  main.appendChild(el('div','step-heading','Escolha o serviço'));

  if(state.services.length===0){
    main.appendChild(el('div','empty-state', `<span class="glyph">✂️</span>Nenhum serviço cadastrado ainda.<br>Volte em breve.`));
    return;
  }

  state.services.forEach(svc=>{
    const card = el('div', `card svc-card ${state.booking.service?.id===svc.id?'selected':''}`);
    card.innerHTML = `
      <div>
        <div class="svc-name">${svc.name}</div>
        <div class="svc-meta">${svc.duration} min</div>
      </div>
      <div class="svc-price">${money(svc.price)}</div>`;
    card.addEventListener('click', ()=>{
      state.booking.service = svc;
      clientStep = 2;
      renderClient();
    });
    main.appendChild(card);
  });
}

function renderStepDate(main){
  const bar = el('div','back-row');
  bar.innerHTML = `<button class="back-btn">&larr; Voltar</button>`;
  bar.querySelector('button').addEventListener('click', ()=>{ clientStep=1; renderClient(); });
  main.appendChild(bar);

  main.appendChild(el('div','step-title','Passo 2 de 4'));
  main.appendChild(el('div','step-heading','Escolha a data'));

  const chips = el('div','date-quickpicks');
  const today = new Date();
  for(let i=0;i<21;i++){
    const d = new Date(today); d.setDate(d.getDate()+i);
    const ds = toDateStr(d);
    const dow = DOW_KEYS[d.getDay()];
    const closed = state.config.hours[dow]?.closed || state.config.blockedDates.includes(ds);
    const chip = el('div', `day-chip ${closed?'disabled':''} ${state.booking.date===ds?'selected':''}`);
    chip.innerHTML = `<div class="dow">${DOW_LABELS[d.getDay()]}</div><div class="num">${d.getDate()}</div>`;
    if(!closed){
      chip.addEventListener('click', ()=>{
        state.booking.date = ds;
        clientStep = 3;
        renderClient();
      });
    }
    chips.appendChild(chip);
  }
  main.appendChild(chips);
}

async function renderStepTime(main){
  const bar = el('div','back-row');
  bar.innerHTML = `<button class="back-btn">&larr; Voltar</button>`;
  bar.querySelector('button').addEventListener('click', ()=>{ clientStep=2; renderClient(); });
  main.appendChild(bar);

  main.appendChild(el('div','step-title','Passo 3 de 4'));
  main.appendChild(el('div','step-heading', `Horários — ${fromDateStr(state.booking.date).toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'})}`));

  const loading = el('div','empty-state', 'Carregando horários...');
  main.appendChild(loading);

  const times = await getAvailableTimes(state.booking.date, state.booking.service.duration);
  loading.remove();

  if(times.length===0){
    main.appendChild(el('div','empty-state', `<span class="glyph">📅</span>Sem horários disponíveis nesse dia.<br>Escolha outra data.`));
    return;
  }

  const grid = el('div','time-grid');
  times.forEach(t=>{
    const slot = el('div', `time-slot ${state.booking.time===t?'selected':''}`, t);
    slot.addEventListener('click', ()=>{
      state.booking.time = t;
      clientStep = 4;
      renderClient();
    });
    grid.appendChild(slot);
  });
  main.appendChild(grid);
}

function renderStepIdentify(main){
  const bar = el('div','back-row');
  bar.innerHTML = `<button class="back-btn">&larr; Voltar</button>`;
  bar.querySelector('button').addEventListener('click', ()=>{ clientStep=3; renderClient(); });
  main.appendChild(bar);

  main.appendChild(el('div','step-title','Passo 4 de 4'));
  main.appendChild(el('div','step-heading','Seus dados'));

  main.appendChild(el('label','field-label','Seu nome'));
  const nameInput = el('input'); nameInput.type='text'; nameInput.placeholder='Nome completo'; nameInput.value = state.booking.name;
  nameInput.addEventListener('input', e=>{ state.booking.name = e.target.value; validateIdentify(); });
  main.appendChild(nameInput);

  main.appendChild(el('label','field-label','Seu celular / WhatsApp'));
  const phoneInput = el('input'); phoneInput.type='tel'; phoneInput.placeholder='(21) 99999-9999'; phoneInput.value = state.booking.phone;
  phoneInput.addEventListener('input', e=>{ e.target.value = phoneMask(e.target.value); state.booking.phone = e.target.value; validateIdentify(); });
  main.appendChild(phoneInput);

  main.appendChild(el('label','field-label','Observação (opcional)'));
  const noteInput = el('textarea'); noteInput.rows=2; noteInput.placeholder='Alguma observação para o barbeiro?'; noteInput.value = state.booking.note;
  noteInput.addEventListener('input', e=>{ state.booking.note = e.target.value; });
  main.appendChild(noteInput);

  const summary = el('div','summary-box');
  summary.innerHTML = `
    <div class="summary-row"><span>Serviço</span><strong>${state.booking.service.name}</strong></div>
    <div class="summary-row"><span>Data</span><strong>${fromDateStr(state.booking.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})}</strong></div>
    <div class="summary-row"><span>Horário</span><strong>${state.booking.time}</strong></div>
    <div class="summary-row"><span>Valor</span><strong>${money(state.booking.service.price)}</strong></div>`;
  main.appendChild(summary);

  const bottomBar = el('div','bottom-bar');
  const btn = el('button','btn btn-primary','Confirmar agendamento');
  btn.disabled = true;
  btn.addEventListener('click', confirmBooking);
  bottomBar.appendChild(btn);
  main.appendChild(bottomBar);

  function validateIdentify(){
    btn.disabled = !(state.booking.name.trim().length>=3 && state.booking.phone.replace(/\D/g,'').length>=10);
  }
}

async function confirmBooking(){
  const b = state.booking;
  try{
    const batch = writeBatch(db);
    const apptRef = doc(collection(db,'appointments'));
    batch.set(apptRef, {
      serviceId: b.service.id, serviceName: b.service.name, price: b.service.price, duration: b.service.duration,
      date: b.date, time: b.time, clientName: b.name.trim(), clientPhone: b.phone,
      note: b.note.trim(), status: 'agendado', createdAt: Timestamp.now()
    });
    const slotRef = doc(collection(db,'slots'));
    batch.set(slotRef, { date: b.date, time: b.time, duration: b.service.duration, apptId: apptRef.id });
    await batch.commit();
    clientStep = 5;
    renderClient();
  }catch(err){
    console.error(err);
    showToast('Erro ao agendar. Tente novamente.');
  }
}

function renderStepDone(main){
  const box = el('div','confirm-screen');
  box.innerHTML = `
    <div class="glyph">✓</div>
    <h2>Agendamento confirmado!</h2>
    <p>${state.booking.name.split(' ')[0]}, seu horário para <strong>${state.booking.service.name}</strong><br>
    dia ${fromDateStr(state.booking.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} às ${state.booking.time} está reservado.</p>`;
  main.appendChild(box);

  const btn = el('button','btn btn-primary','Fazer novo agendamento');
  btn.style.marginTop='20px';
  btn.addEventListener('click', ()=>{
    state.booking = { service:null, date:null, time:null, name:'', phone:'', note:'' };
    clientStep = 1;
    renderClient();
  });
  main.appendChild(btn);
}

// ==========================================================================
// RENDER — ADMIN
// ==========================================================================
onAuthStateChanged(auth, user=>{
  state.admin.user = user;
  if(state.route==='admin') render();
});

function renderAdmin(){
  const root = $('#app');
  root.innerHTML = '';
  if(!state.admin.user){ renderAdminLogin(root); return; }

  const wrap = el('div','wrap admin-wrap');
  const header = el('div','admin-header');
  header.innerHTML = `<h1>${state.config.businessName} &mdash; Painel</h1>`;
  const logoutBtn = el('button','logout-btn','Sair');
  logoutBtn.addEventListener('click', ()=> signOut(auth));
  header.appendChild(logoutBtn);
  wrap.appendChild(header);

  const tabs = el('div','tabs');
  [['agendamentos','Agendamentos'],['ganhos','Ganhos'],['servicos','Serviços'],['horarios','Horários']].forEach(([key,label])=>{
    const t = el('div', `tab ${state.admin.tab===key?'active':''}`, label);
    t.addEventListener('click', ()=>{ state.admin.tab = key; renderAdmin(); });
    tabs.appendChild(t);
  });
  wrap.appendChild(tabs);

  const panelAg = el('div', `tab-panel ${state.admin.tab==='agendamentos'?'active':''}`); panelAg.id='panel-agendamentos';
  const panelGa = el('div', `tab-panel ${state.admin.tab==='ganhos'?'active':''}`); panelGa.id='panel-ganhos';
  const panelSv = el('div', `tab-panel ${state.admin.tab==='servicos'?'active':''}`); panelSv.id='panel-servicos';
  const panelHo = el('div', `tab-panel ${state.admin.tab==='horarios'?'active':''}`); panelHo.id='panel-horarios';
  wrap.appendChild(panelAg); wrap.appendChild(panelGa); wrap.appendChild(panelSv); wrap.appendChild(panelHo);
  root.appendChild(wrap);

  if(state.admin.tab==='agendamentos') renderAdminAppointments(panelAg);
  if(state.admin.tab==='ganhos') renderAdminEarnings(panelGa);
  if(state.admin.tab==='servicos') renderAdminServices(panelSv);
  if(state.admin.tab==='horarios') renderAdminHours(panelHo);
}

function renderAdminLogin(root){
  const wrap = el('div','wrap');
  const box = el('div','login-box');
  box.innerHTML = `
    <h2>Barber Agenda</h2>
    <p style="text-align:center; color:var(--muted); font-size:13px; margin:-14px 0 18px;">Painel administrativo</p>
    <label class="field-label">E-mail</label>
    <input type="text" id="login-email" placeholder="seu@email.com">
    <label class="field-label">Senha</label>
    <input type="text" id="login-pass" placeholder="Senha" style="-webkit-text-security:disc;">
    <button class="btn btn-primary" id="login-btn" style="margin-top:20px;">Entrar</button>
    <button class="btn-link" id="back-to-client" style="display:block; margin:16px auto 0;">&larr; Voltar para agendamento</button>`;
  wrap.appendChild(box);
  root.appendChild(wrap);

  $('#back-to-client').addEventListener('click', ()=>{ location.hash=''; });
  $('#login-btn').addEventListener('click', async ()=>{
    const email = $('#login-email').value.trim();
    const pass = $('#login-pass').value;
    try{
      await signInWithEmailAndPassword(auth, email, pass);
    }catch(err){
      showToast('E-mail ou senha inválidos.');
    }
  });
}

// ----- Agendamentos -----
let unsubAppts = null;
function renderAdminAppointments(panel){
  panel.innerHTML = `
    <input type="date" id="appt-date" value="${state.admin.selectedDate}">
    <div id="appt-list" style="margin-top:14px;"></div>`;
  $('#appt-date').addEventListener('change', e=>{
    state.admin.selectedDate = e.target.value;
    subscribeAppointments();
  });
  subscribeAppointments();

  function subscribeAppointments(){
    if(unsubAppts) unsubAppts();
    const list = $('#appt-list');
    list.innerHTML = '<div class="empty-state">Carregando...</div>';
    const q = query(collection(db,'appointments'), where('date','==', state.admin.selectedDate));
    unsubAppts = onSnapshot(q, snap=>{
      const items = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> a.time.localeCompare(b.time));
      list.innerHTML = '';
      if(items.length===0){ list.innerHTML = '<div class="empty-state"><span class="glyph">📭</span>Nenhum agendamento nesse dia.</div>'; return; }
      items.forEach(a=>{
        const card = el('div','card appt-card');
        card.innerHTML = `
          <div class="appt-time">${a.time}</div>
          <div class="appt-info">
            <div class="name">${a.clientName}</div>
            <div class="meta">${a.serviceName} &middot; ${money(a.price)} &middot; ${a.clientPhone}</div>
            ${a.note ? `<div class="meta">"${a.note}"</div>` : ''}
            <span class="badge ${a.status}">${a.status}</span>
          </div>
          <div class="appt-actions"></div>`;
        const actions = card.querySelector('.appt-actions');
        if(a.status==='agendado'){
          const okBtn = el('button','icon-btn ok','✓');
          okBtn.addEventListener('click', ()=> updateApptStatus(a.id,'concluido'));
          const cancelBtn = el('button','icon-btn danger','✕');
          cancelBtn.addEventListener('click', ()=> updateApptStatus(a.id,'cancelado', a.date, a.time));
          actions.appendChild(okBtn); actions.appendChild(cancelBtn);
        }
        list.appendChild(card);
      });
    });
  }
}

async function updateApptStatus(id, status, date, time){
  await updateDoc(doc(db,'appointments',id), { status });
  if(status==='cancelado' && date && time){
    const slotSnap = await getDocs(query(collection(db,'slots'), where('apptId','==', id)));
    slotSnap.docs.forEach(d=> deleteDoc(doc(db,'slots', d.id)));
  }
  showToast('Atualizado.');
}

// ----- Ganhos -----
function renderAdminEarnings(panel){
  panel.innerHTML = `
    <div class="period-tabs" id="period-tabs">
      <button data-p="hoje">Hoje</button>
      <button data-p="semana">Semana</button>
      <button data-p="mes">Mês</button>
    </div>
    <div id="earnings-body"></div>`;
  panel.querySelectorAll('#period-tabs button').forEach(b=>{
    if(b.dataset.p===state.admin.earningsPeriod) b.classList.add('active');
    b.addEventListener('click', ()=>{ state.admin.earningsPeriod = b.dataset.p; renderAdminEarnings(panel); });
  });
  loadEarnings();

  async function loadEarnings(){
    const body = $('#earnings-body'); body.innerHTML = '<div class="empty-state">Calculando...</div>';
    const today = new Date();
    let start;
    if(state.admin.earningsPeriod==='hoje') start = new Date(today);
    else if(state.admin.earningsPeriod==='semana'){ start = new Date(today); start.setDate(start.getDate()-6); }
    else { start = new Date(today.getFullYear(), today.getMonth(), 1); }
    const startStr = toDateStr(start);
    const endStr = toDateStr(today);

    const snap = await getDocs(query(collection(db,'appointments'),
      where('date','>=', startStr), where('date','<=', endStr)));
    const items = snap.docs.map(d=>d.data()).filter(a=>a.status==='concluido');
    const total = items.reduce((s,a)=>s+(a.price||0),0);

    body.innerHTML = `
      <div class="earnings-total">
        <div class="big">${money(total)}</div>
        <div class="lbl">${items.length} atendimento${items.length===1?'':'s'} concluído${items.length===1?'':'s'}</div>
      </div>`;
    const bySvc = {};
    items.forEach(a=>{ bySvc[a.serviceName] = (bySvc[a.serviceName]||0) + a.price; });
    Object.entries(bySvc).sort((a,b)=>b[1]-a[1]).forEach(([name,val])=>{
      const row = el('div','card svc-row');
      row.innerHTML = `<span>${name}</span><strong>${money(val)}</strong>`;
      body.appendChild(row);
    });
  }
}

// ----- Serviços -----
function renderAdminServices(panel){
  panel.innerHTML = `<div id="svc-list"></div>
    <div class="form-inline" style="margin-top:16px; flex-wrap:wrap;">
      <input type="text" id="new-svc-name" placeholder="Nome do serviço" style="flex:1 1 100%; margin-bottom:8px;">
      <input type="text" id="new-svc-price" placeholder="Preço (ex: 45)" style="flex:1;">
      <input type="text" id="new-svc-duration" placeholder="Min." style="flex:1;">
      <button class="small-btn" id="add-svc-btn">Adicionar</button>
    </div>`;
  renderList();

  function renderList(){
    const list = $('#svc-list'); list.innerHTML = '';
    if(state.services.length===0) list.innerHTML = '<div class="empty-state">Nenhum serviço cadastrado.</div>';
    state.services.forEach(svc=>{
      const row = el('div','card svc-row');
      row.innerHTML = `<span>${svc.name} &middot; ${svc.duration}min</span>`;
      const right = el('div'); right.style.display='flex'; right.style.gap='8px'; right.style.alignItems='center';
      right.innerHTML = `<strong>${money(svc.price)}</strong>`;
      const delBtn = el('button','icon-btn danger','✕');
      delBtn.addEventListener('click', async ()=>{ await deleteDoc(doc(db,'services',svc.id)); showToast('Serviço removido.'); });
      right.appendChild(delBtn);
      row.appendChild(right);
      list.appendChild(row);
    });
  }

  $('#add-svc-btn').addEventListener('click', async ()=>{
    const name = $('#new-svc-name').value.trim();
    const price = parseFloat($('#new-svc-price').value.replace(',','.'));
    const duration = parseInt($('#new-svc-duration').value);
    if(!name || isNaN(price) || isNaN(duration)){ showToast('Preencha todos os campos.'); return; }
    await addDoc(collection(db,'services'), { name, price, duration, order: state.services.length });
    $('#new-svc-name').value=''; $('#new-svc-price').value=''; $('#new-svc-duration').value='';
    showToast('Serviço adicionado.');
  });
}

function renderAdminServicesIfActive(){
  if(state.route==='admin' && state.admin.tab==='servicos' && state.admin.user){
    const panel = $('#panel-servicos'); if(panel) renderAdminServices(panel);
  }
}

// ----- Horários -----
function renderAdminHours(panel){
  panel.innerHTML = `
    <div class="step-title" style="margin-bottom:8px;">Identidade da barbearia</div>
    <label class="field-label">Nome do negócio</label>
    <input type="text" id="biz-name-input" value="${state.config.businessName}" placeholder="Ex: Barbearia do João">
    <label class="field-label">Logo (aparece na tela inicial dos clientes)</label>
    <div style="display:flex; align-items:center; gap:14px; margin-top:6px;">
      <img id="logo-preview" src="${state.config.logo || DEFAULT_LOGO_SVG}" alt="Logo" style="width:60px; height:60px; border-radius:12px; border:1px solid var(--line); object-fit:cover;">
      <input type="file" id="logo-file-input" accept="image/*" style="flex:1; font-size:12px;">
    </div>
    <button class="btn btn-primary" id="save-identity-btn" style="margin-top:14px;">Salvar identidade</button>

    <div class="step-title" style="margin-top:32px; margin-bottom:8px;">Funcionamento semanal</div>
    <div id="hours-list"></div>
    <button class="btn btn-primary" id="save-hours-btn" style="margin-top:16px;">Salvar horários</button>

    <div class="step-title" style="margin-top:28px;">Bloquear um dia inteiro</div>
    <div class="form-inline">
      <input type="date" id="block-date-input">
      <button class="small-btn" id="block-date-btn">Bloquear</button>
    </div>
    <div id="blocked-dates-list" style="margin-top:10px;"></div>

    <div class="step-title" style="margin-top:28px;">Bloquear um horário específico</div>
    <div class="form-inline">
      <input type="date" id="block-slot-date">
      <input type="time" id="block-slot-time">
      <button class="small-btn" id="block-slot-btn">Bloquear</button>
    </div>
    <div id="blocked-slots-list" style="margin-top:10px;"></div>`;

  let pendingLogo = state.config.logo || null;
  $('#logo-file-input').addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 5*1024*1024){ showToast('Imagem muito grande (máx. 5MB).'); return; }
    try{
      pendingLogo = await fileToCompressedDataURL(file, 320, 0.85);
      $('#logo-preview').src = pendingLogo;
    }catch(err){ showToast('Não foi possível ler a imagem.'); }
  });

  $('#save-identity-btn').addEventListener('click', async ()=>{
    const businessName = $('#biz-name-input').value.trim() || 'Barber Agenda';
    await setDoc(doc(db,'config','business'), {
      businessName, logo: pendingLogo,
      hours: state.config.hours, blockedDates: state.config.blockedDates
    }, { merge:true });
    showToast('Identidade salva.');
  });

  const hoursList = $('#hours-list');
  DOW_KEYS.forEach((k,i)=>{
    const h = state.config.hours[k] || DEFAULT_HOURS[k];
    const row = el('div','hour-row');
    row.innerHTML = `
      <span class="dow-label">${DOW_LABELS[i]}</span>
      <input type="time" data-k="${k}" data-f="open" value="${h.open}" ${h.closed?'disabled':''}>
      <span>às</span>
      <input type="time" data-k="${k}" data-f="close" value="${h.close}" ${h.closed?'disabled':''}>
      <label class="closed-toggle"><input type="checkbox" data-k="${k}" data-f="closed" ${h.closed?'checked':''}> Fechado</label>`;
    hoursList.appendChild(row);
  });
  hoursList.addEventListener('change', e=>{
    const t = e.target; const k = t.dataset.k; if(!k) return;
    if(t.dataset.f==='closed'){
      const row = t.closest('.hour-row');
      row.querySelectorAll('input[type=time]').forEach(i=> i.disabled = t.checked);
    }
  });

  $('#save-hours-btn').addEventListener('click', async ()=>{
    const newHours = {};
    DOW_KEYS.forEach(k=>{
      const open = hoursList.querySelector(`input[data-k="${k}"][data-f="open"]`).value;
      const close = hoursList.querySelector(`input[data-k="${k}"][data-f="close"]`).value;
      const closed = hoursList.querySelector(`input[data-k="${k}"][data-f="closed"]`).checked;
      newHours[k] = { open, close, closed };
    });
    await setDoc(doc(db,'config','business'), { hours: newHours, blockedDates: state.config.blockedDates }, { merge:true });
    showToast('Horários salvos.');
  });

  $('#block-date-btn').addEventListener('click', async ()=>{
    const val = $('#block-date-input').value; if(!val) return;
    const updated = Array.from(new Set([...state.config.blockedDates, val]));
    await setDoc(doc(db,'config','business'), { hours: state.config.hours, blockedDates: updated }, { merge:true });
    showToast('Dia bloqueado.');
  });

  renderBlockedDates();
  loadBlockedSlots();

  function renderBlockedDates(){
    const list = $('#blocked-dates-list'); list.innerHTML='';
    state.config.blockedDates.forEach(ds=>{
      const row = el('div','card block-row');
      row.innerHTML = `<span>${fromDateStr(ds).toLocaleDateString('pt-BR')}</span>`;
      const rm = el('button','icon-btn danger','✕');
      rm.addEventListener('click', async ()=>{
        const updated = state.config.blockedDates.filter(x=>x!==ds);
        await setDoc(doc(db,'config','business'), { hours: state.config.hours, blockedDates: updated }, { merge:true });
        showToast('Bloqueio removido.');
      });
      row.appendChild(rm);
      list.appendChild(row);
    });
  }

  $('#block-slot-btn').addEventListener('click', async ()=>{
    const date = $('#block-slot-date').value; const time = $('#block-slot-time').value;
    if(!date || !time) return;
    await addDoc(collection(db,'blockedSlots'), { date, time });
    showToast('Horário bloqueado.');
    loadBlockedSlots();
    $('#block-slot-date').value=''; $('#block-slot-time').value='';
  });

  async function loadBlockedSlots(){
    const list = $('#blocked-slots-list'); if(!list) return;
    list.innerHTML = '<div class="empty-state">Carregando...</div>';
    const snap = await getDocs(query(collection(db,'blockedSlots'), orderBy('date')));
    list.innerHTML = '';
    if(snap.empty){ list.innerHTML = '<div class="empty-state">Nenhum horário bloqueado.</div>'; return; }
    snap.docs.forEach(d=>{
      const data = d.data();
      const row = el('div','card block-row');
      row.innerHTML = `<span>${fromDateStr(data.date).toLocaleDateString('pt-BR')} às ${data.time}</span>`;
      const rm = el('button','icon-btn danger','✕');
      rm.addEventListener('click', async ()=>{ await deleteDoc(doc(db,'blockedSlots', d.id)); loadBlockedSlots(); });
      row.appendChild(rm);
      list.appendChild(row);
    });
  }
}

function renderAdminHoursIfActive(){
  if(state.route==='admin' && state.admin.tab==='horarios' && state.admin.user){
    const panel = $('#panel-horarios'); if(panel) renderAdminHours(panel);
  }
}

// ==========================================================================
function render(){
  if(state.route==='admin') renderAdmin();
  else renderClient();
}
render();
</script>
