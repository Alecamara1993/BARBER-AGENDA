<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Barber Agenda — Agendamento</title>
<link rel="icon" id="favicon-link" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141210;
    --bg-panel:#1c1917;
    --bg-panel-2:#242019;
    --line:#3a332a;
    --gold:#c9a227;
    --gold-light:#e6c866;
    --white:#f5f1e8;
    --muted:#948a78;
    --red:#a13a3a;
    --green:#5c8a5c;
    --radius:14px;
    --serif:'Cormorant Garamond', serif;
    --display:'Bebas Neue', sans-serif;
    --sans:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .stripe{
    height:6px;
    background:repeating-linear-gradient(-45deg, var(--gold) 0 10px, var(--white) 10px 20px, #1a1a1a 20px 30px);
    opacity:.85;
  }
  .wrap{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg);}
  header.brand{padding:28px 20px 20px; text-align:center; border-bottom:1px solid var(--line);}
  header.brand img{width:64px; height:64px; margin-bottom:10px;}
  header.brand .eyebrow{font-family:var(--serif); letter-spacing:.35em; font-size:11px; color:var(--gold); text-transform:uppercase;}
  header.brand h1{font-family:var(--display); font-size:34px; letter-spacing:.03em; color:var(--white); line-height:1;}
  header.brand h1 span{color:var(--gold);}
  header.brand .sub{font-family:var(--serif); font-style:italic; font-size:15px; color:var(--muted); letter-spacing:.15em; text-transform:uppercase; margin-top:2px;}

  .steps{display:flex; justify-content:center; gap:6px; padding:16px 20px 0;}
  .step-dot{flex:1; max-width:64px; height:3px; border-radius:3px; background:var(--line); transition:background .3s;}
  .step-dot.active{background:var(--gold);}
  .step-dot.done{background:var(--gold-light);}

  main{flex:1; padding:20px; padding-bottom:100px;}
  .step-title{font-family:var(--serif); font-size:13px; letter-spacing:.25em; text-transform:uppercase; color:var(--muted); margin-bottom:4px;}
  .step-heading{font-family:var(--display); font-size:26px; letter-spacing:.02em; margin-bottom:18px;}

  .card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    transition:border-color .15s, transform .1s;
  }
  .svc-card{display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .svc-card:active{transform:scale(.98);}
  .svc-card.selected{border-color:var(--gold); background:var(--bg-panel-2);}
  .svc-name{font-weight:600; font-size:16px;}
  .svc-meta{color:var(--muted); font-size:13px; margin-top:2px;}
  .svc-price{font-family:var(--display); font-size:20px; color:var(--gold-light); letter-spacing:.02em;}

  .empty-state{text-align:center; padding:40px 20px; color:var(--muted);}
  .empty-state .glyph{font-size:28px; margin-bottom:8px; display:block;}

  input[type=date], .date-input{
    width:100%; padding:14px; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:var(--radius); color:var(--white); font-size:16px; font-family:var(--sans);
  }
  .date-quickpicks{display:flex; gap:8px; margin-top:12px; overflow-x:auto; padding-bottom:4px;}
  .day-chip{
    flex:0 0 auto; min-width:56px; text-align:center; padding:10px 6px; border-radius:10px;
    background:var(--bg-panel); border:1px solid var(--line); cursor:pointer; font-size:12px;
  }
  .day-chip .dow{color:var(--muted); text-transform:uppercase; font-size:10px; letter-spacing:.05em;}
  .day-chip .num{font-family:var(--display); font-size:20px; margin-top:2px;}
  .day-chip.selected{border-color:var(--gold); background:var(--bg-panel-2);}
  .day-chip.disabled{opacity:.35; pointer-events:none;}

  .time-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .time-slot{
    padding:12px 4px; text-align:center; border-radius:10px; background:var(--bg-panel);
    border:1px solid var(--line); cursor:pointer; font-weight:600; font-size:15px;
  }
  .time-slot.selected{border-color:var(--gold); background:var(--gold); color:#141210;}

  label.field-label{display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px;}
  input[type=text], input[type=tel], textarea{
    width:100%; padding:14px; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:var(--radius); color:var(--white); font-size:16px; font-family:var(--sans);
  }
  input:focus, textarea:focus{outline:none; border-color:var(--gold);}

  .summary-box{background:var(--bg-panel-2); border:1px solid var(--gold); border-radius:var(--radius); padding:16px; margin-top:16px;}
  .summary-row{display:flex; justify-content:space-between; font-size:14px; padding:4px 0; color:var(--muted);}
  .summary-row strong{color:var(--white); font-weight:600;}

  .bottom-bar{
    position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto;
    background:linear-gradient(0deg, var(--bg) 60%, transparent); padding:20px; padding-top:36px;
  }
  .btn{
    display:block; width:100%; text-align:center; padding:16px; border-radius:var(--radius);
    font-family:var(--display); font-size:18px; letter-spacing:.05em; border:none; cursor:pointer;
  }
  .btn-primary{background:var(--gold); color:#141210;}
  .btn-primary:disabled{background:var(--line); color:var(--muted); cursor:not-allowed;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--white); margin-top:8px;}
  .btn-link{background:none; border:none; color:var(--gold); font-family:var(--sans); font-size:13px; text-decoration:underline; cursor:pointer;}
  .back-row{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .back-btn{color:var(--gold); font-size:14px; cursor:pointer; background:none; border:none;}

  .confirm-screen{text-align:center; padding:40px 20px;}
  .confirm-screen .glyph{font-size:48px; color:var(--gold);}
  .confirm-screen h2{font-family:var(--display); font-size:28px; margin:12px 0 6px;}
  .confirm-screen p{color:var(--muted); font-size:14px; line-height:1.5;}

  footer.foot{text-align:center; padding:16px; color:var(--muted); font-size:11px;}
  footer.foot button{background:none; border:none; color:var(--muted); font-size:11px; text-decoration:underline; cursor:pointer;}

  /* ---------- ADMIN ---------- */
  .admin-wrap{max-width:720px;}
  .login-box{max-width:360px; margin:80px auto; padding:0 20px;}
  .login-box h2{font-family:var(--display); font-size:28px; text-align:center; margin-bottom:20px;}
  .admin-header{display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--line);}
  .admin-header h1{font-family:var(--display); font-size:22px;}
  .logout-btn{color:var(--muted); font-size:12px; background:none; border:none; text-decoration:underline; cursor:pointer;}
  .tabs{display:flex; gap:4px; padding:12px 16px 0; overflow-x:auto;}
  .tab{padding:10px 14px; font-size:13px; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; font-weight:600;}
  .tab.active{color:var(--gold); border-color:var(--gold);}
  .tab-panel{padding:16px 20px 60px; display:none;}
  .tab-panel.active{display:block;}

  .appt-card{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .appt-time{font-family:var(--display); font-size:20px; color:var(--gold-light); min-width:56px;}
  .appt-info{flex:1;}
  .appt-info .name{font-weight:600;}
  .appt-info .meta{color:var(--muted); font-size:12px; margin-top:2px;}
  .badge{font-size:10px; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
  .badge.agendado{background:#3a3320; color:var(--gold-light);}
  .badge.concluido{background:#243a24; color:var(--green);}
  .badge.cancelado{background:#3a2424; color:var(--red);}
  .appt-actions{display:flex; gap:6px;}
  .icon-btn{padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg-panel-2); color:var(--white); font-size:12px; cursor:pointer;}
  .icon-btn.danger{border-color:var(--red); color:#e08a8a;}
  .icon-btn.ok{border-color:var(--green); color:#9ed49e;}

  .earnings-total{text-align:center; padding:24px 0;}
  .earnings-total .big{font-family:var(--display); font-size:44px; color:var(--gold-light);}
  .earnings-total .lbl{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.1em;}
  .period-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .period-tabs button{flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg-panel); color:var(--muted); font-size:13px; cursor:pointer;}
  .period-tabs button.active{border-color:var(--gold); color:var(--gold);}

  .svc-row, .hour-row, .block-row{display:flex; align-items:center; gap:10px; justify-content:space-between;}
  .hour-row{padding:10px 0; border-bottom:1px solid var(--line);}
  .hour-row .dow-label{width:80px; font-weight:600; font-size:14px;}
  .hour-row input[type=time]{background:var(--bg-panel-2); border:1px solid var(--line); color:var(--white); border-radius:8px; padding:8px; font-size:13px;}
  .hour-row label.closed-toggle{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted);}

  .form-inline{display:flex; gap:8px; margin-top:10px;}
  .form-inline input{flex:1;}
  .small-btn{padding:12px 16px; border-radius:10px; background:var(--gold); color:#141210; border:none; font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--gold); color:#141210;
    padding:12px 20px; border-radius:10px; font-weight:600; font-size:14px; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .barber-card{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .barber-card:active{transform:scale(.98);}
  .barber-card.selected{border-color:var(--gold); background:var(--bg-panel-2);}
  .barber-avatar{width:48px; height:48px; border-radius:50%; object-fit:cover; border:1px solid var(--line); background:var(--bg-panel-2); flex:0 0 auto;}
  .barber-avatar.icon{display:flex; align-items:center; justify-content:center; font-size:20px;}
  .barber-name{font-weight:600; font-size:16px;}
  .barber-meta{color:var(--muted); font-size:12px; margin-top:2px;}
  .calendar-actions{display:flex; gap:8px; margin-top:18px;}
  .calendar-actions a, .calendar-actions button{flex:1; font-family:var(--sans); font-size:13px; font-weight:600; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--bg-panel); color:var(--white); text-align:center; text-decoration:none; cursor:pointer;}
  .tenant-missing{max-width:420px; margin:80px auto; padding:0 24px; text-align:center; color:var(--muted);}
  .tenant-missing h2{font-family:var(--display); color:var(--gold); font-size:26px; margin-bottom:10px;}
  .tenant-missing code{background:var(--bg-panel); border:1px solid var(--line); padding:2px 6px; border-radius:6px; color:var(--gold-light);}
  .barber-list-row{display:flex; align-items:center; gap:12px;}
  .barber-list-row .barber-avatar{width:40px; height:40px;}
  .barber-list-row .info{flex:1;}
  .barber-list-row .svc-tags{color:var(--muted); font-size:11px; margin-top:2px;}
  .checkbox-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .checkbox-grid label{display:flex; align-items:center; gap:6px; background:var(--bg-panel-2); border:1px solid var(--line); padding:8px 10px; border-radius:8px; font-size:12px; cursor:pointer;}
  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast-root"></div>

<script type="module">
/* =========================================================================
   BARBER AGENDA — Sistema de Agendamento (SaaS para barbearias)
   Firebase Firestore + Auth. Config abaixo: cole as chaves do seu projeto.
   ========================================================================= */

// ---------- CONFIGURAÇÃO FIREBASE (cole aqui suas chaves) ----------
const firebaseConfig = {
  apiKey: "AIzaSyAxdSvWBLfbTunb-8lW0hUY1D9OIQLX71g",
  authDomain: "barber-agenda-53c9d.firebaseapp.com",
  projectId: "barber-agenda-53c9d",
  storageBucket: "barber-agenda-53c9d.firebasestorage.app",
  messagingSenderId: "167143504123",
  appId: "1:167143504123:web:ea2ff6554a8db9e78cd85e"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc,
  query, where, orderBy, onSnapshot, writeBatch, runTransaction, arrayUnion, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* -------------------------------------------------------------------------
   MULTI-TENANT: cada barbearia vive em tenants/{tenantSlug}/...
   IMPORTANTE — configure as Firestore Security Rules no console assim
   (troca simples de leitura pública / escrita restrita ao dono do tenant):

   match /tenants/{tenantSlug} {
     match /config/business { allow read: if true; allow write: if request.auth.token.email in resource.data.adminEmails || !exists(/databases/$(database)/documents/tenants/$(tenantSlug)/config/business); }
     match /services/{d}      { allow read: if true; allow write: if request.auth.token.email in get(/databases/$(database)/documents/tenants/$(tenantSlug)/config/business).data.adminEmails; }
     match /barbers/{d}       { allow read: if true; allow write: if request.auth.token.email in get(/databases/$(database)/documents/tenants/$(tenantSlug)/config/business).data.adminEmails; }
     match /appointments/{d}  { allow read, write: if request.auth.token.email in get(/databases/$(database)/documents/tenants/$(tenantSlug)/config/business).data.adminEmails; allow create: if true; }
     match /scheduleLocks/{d} { allow read: if true; allow write: if true; } // escrita via transação no confirmBooking
     match /clients/{d}       { allow read, write: if request.auth.token.email in get(/databases/$(database)/documents/tenants/$(tenantSlug)/config/business).data.adminEmails; allow create, update: if true; }
     match /blockedSlots/{d}  { allow read: if true; allow write: if request.auth.token.email in get(/databases/$(database)/documents/tenants/$(tenantSlug)/config/business).data.adminEmails; }
   }
   ------------------------------------------------------------------------- */
const tCol = name => collection(db, 'tenants', state_tenantSlugRef(), name);
const tDoc = (name, id) => doc(db, 'tenants', state_tenantSlugRef(), name, id);
const tConfigDoc = () => doc(db, 'tenants', state_tenantSlugRef(), 'config', 'business');
function state_tenantSlugRef(){ return state.tenantSlug; }

function resolveTenantSlug(){
  // suporta #/minha-barbearia  |  #/minha-barbearia/admin  |  ?tenant=slug  |  ?t=slug
  const hash = location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  let slug = null, isAdmin = false;
  if(parts.length){
    if(parts[0] === 'admin'){ isAdmin = true; }
    else { slug = parts[0]; if(parts[1] === 'admin') isAdmin = true; }
  }
  if(!slug){
    const qp = new URLSearchParams(location.search);
    slug = qp.get('tenant') || qp.get('t') || slug;
  }
  return { slug, isAdmin };
}
function adminHashFor(slug){ return `#/${slug}/admin`; }
function clientHashFor(slug){ return `#/${slug}`; }

const DEFAULT_LOGO_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <pattern id="stripes" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#141210"/>
      <rect width="6" height="12" fill="#c9a227"/>
    </pattern>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#1c1917" stroke="#c9a227" stroke-width="3"/>
  <circle cx="50" cy="50" r="33" fill="url(#stripes)" stroke="#f5f1e8" stroke-width="2"/>
</svg>
`.trim());

// ---------- CONSTANTES ----------
const DOW_KEYS = ['dom','seg','ter','qua','qui','sex','sab'];
const DOW_LABELS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DEFAULT_HOURS = DOW_KEYS.reduce((acc,k)=>{ acc[k] = {open:"09:00", close:"19:00", closed:false}; return acc; }, {});
const SLOT_STEP = 30; // minutos

// ---------- HELPERS ----------
const $ = (sel, ctx=document) => ctx.querySelector(sel);
const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html!==undefined) e.innerHTML = html; return e; };
const pad = n => String(n).padStart(2,'0');
const toDateStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromDateStr = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const timeToMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const minToTime = min => `${pad(Math.floor(min/60))}:${pad(min%60)}`;
const money = v => v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const showToast = msg => {
  const root = $('#toast-root'); root.innerHTML = '';
  const t = el('div','toast', msg); root.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2600);
};
function fileToCompressedDataURL(file, maxSize=320, quality=0.85){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
        else{ if(h > maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png', quality));
      };
      img.onerror = () => reject(new Error('invalid image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}
const phoneMask = v => {
  v = v.replace(/\D/g,'').slice(0,11);
  if(v.length > 6) return `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
  if(v.length > 2) return `(${v.slice(0,2)}) ${v.slice(2)}`;
  return v;
};

// ---------- ESTADO ----------
const state = {
  tenantSlug: null,
  route: 'client',
  services: [],
  barbers: [],
  config: { hours: DEFAULT_HOURS, blockedDates: [], businessName: 'Barber Agenda', logo: null, adminEmails: [] },
  booking: { service:null, barber:null, barberMode:null, date:null, time:null, candidatesByTime:{}, name:'', phone:'', note:'', confirmedBarberId:null, _apptId:null },
  admin: { user:null, tab:'agendamentos', dayAppointments:[], selectedDate: toDateStr(new Date()), earningsPeriod:'hoje', services:[], blockedDates:[], blockedSlots:[] }
};

let tenantListenersAttached = false;
function attachTenantListeners(){
  if(tenantListenersAttached) return;
  tenantListenersAttached = true;

  onSnapshot(tCol('services'), snap=>{
    state.services = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.order??0)-(b.order??0));
    if(state.route==='client') render();
    if(state.route==='admin') renderAdminServicesIfActive();
  });

  onSnapshot(tCol('barbers'), snap=>{
    state.barbers = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.order??0)-(b.order??0));
    if(state.route==='client') render();
    if(state.route==='admin') renderAdminBarbersIfActive();
  });

  onSnapshot(tConfigDoc(), snap=>{
    if(snap.exists()){
      const data = snap.data();
      state.config.hours = { ...DEFAULT_HOURS, ...(data.hours||{}) };
      state.config.blockedDates = data.blockedDates || [];
      state.config.businessName = data.businessName || 'Barber Agenda';
      state.config.logo = data.logo || null;
      state.config.adminEmails = data.adminEmails || [];
    }
    document.title = `${state.config.businessName} — Agendamento`;
    const favicon = $('#favicon-link');
    if(favicon) favicon.href = state.config.logo || DEFAULT_LOGO_SVG;
    if(state.route==='client') render();
    if(state.route==='admin'){ renderAdminHoursIfActive(); if(state.admin.user) $('.admin-header h1') && ($('.admin-header h1').textContent = `${state.config.businessName} — Painel`); }
  });
}

function renderTenantMissing(){
  const root = $('#app'); root.innerHTML = '';
  const box = el('div','tenant-missing');
  box.innerHTML = `
    <h2>Barbearia não identificada</h2>
    <p>Acesse com o endereço da sua barbearia, por exemplo:<br><code>seudominio.com/#/minha-barbearia</code></p>
    <p style="margin-top:10px;">Para o painel administrativo:<br><code>seudominio.com/#/minha-barbearia/admin</code></p>`;
  root.appendChild(box);
}

function routeFromHash(){
  const { slug, isAdmin } = resolveTenantSlug();
  state.route = isAdmin ? 'admin' : 'client';
  if(slug !== state.tenantSlug){
    state.tenantSlug = slug;
    tenantListenersAttached = false;

  if(!state.tenantSlug){ renderTenantMissing(); return; }
  attachTenantListeners();

}

// ---------- DISPONIBILIDADE ----------
function barbersForService(serviceId){
  return state.barbers.filter(b => b.active!==false && (!b.services || b.services.length===0 || b.services.includes(serviceId)));
}

async function freeTimesForBarber(barberId, dateStr, duration, openMin, closeMin, blockedTimes, isToday, nowMin){
  const lockSnap = await getDoc(tDoc('scheduleLocks', `${barberId}_${dateStr}`));
  const busyRanges = lockSnap.exists() ? (lockSnap.data().booked||[]).map(x=>[x.start, x.start + (x.duration||30)]) : [];
  const slots = [];
  for(let t=openMin; t + duration <= closeMin; t += SLOT_STEP){
    const time = minToTime(t);
    if(blockedTimes.has(time)) continue;
    if(isToday && t < nowMin) continue;
    const overlaps = busyRanges.some(([s,e]) => t < e && (t+duration) > s);
    if(overlaps) continue;
    slots.push(time);
  }
  return slots;
}

// Retorna { times: string[], candidatesByTime: {time: [barberId,...]} }
async function getAvailableTimes(dateStr, duration, barberId){
  const d = fromDateStr(dateStr);
  const dow = DOW_KEYS[d.getDay()];
  const hours = state.config.hours[dow];
  if(!hours || hours.closed) return { times:[], candidatesByTime:{} };
  if(state.config.blockedDates.includes(dateStr)) return { times:[], candidatesByTime:{} };

  const openMin = timeToMin(hours.open);
  const closeMin = timeToMin(hours.close);

  const blockedSnap = await getDocs(query(tCol('blockedSlots'), where('date','==', dateStr)));
  const blockedTimes = new Set(blockedSnap.docs.map(d=>d.data().time));

  const now = new Date();
  const isToday = dateStr === toDateStr(now);
  const nowMin = now.getHours()*60 + now.getMinutes() + 30; // buffer de 30min

  if(barberId){
    const times = await freeTimesForBarber(barberId, dateStr, duration, openMin, closeMin, blockedTimes, isToday, nowMin);
    return { times, candidatesByTime: Object.fromEntries(times.map(t=>[t,[barberId]])) };
  }

  // "Primeiro disponível": une horários livres de todos os barbeiros elegíveis
  const eligible = barbersForService(state.booking.service.id);
  const candidatesByTime = {};
  for(const b of eligible){
    const times = await freeTimesForBarber(b.id, dateStr, duration, openMin, closeMin, blockedTimes, isToday, nowMin);
    times.forEach(t=>{ (candidatesByTime[t] = candidatesByTime[t] || []).push(b.id); });
  }
  const times = Object.keys(candidatesByTime).sort();
  return { times, candidatesByTime };
}

// Reserva atômica reutilizável (cliente e agendamento manual do ADM).
// params: { service, candidates:[barberId,...], date, time, name, phone, note, source }
// retorna { ok:true, barberId, apptId } ou { ok:false }
async function attemptBooking(params){
  const { service, candidates, date, time, name, phone, note, source } = params;
  const duration = service.duration;

  for(const barberId of candidates){
    try{
      let newApptId = null;
      await runTransaction(db, async (trx)=>{
        const lockRef = tDoc('scheduleLocks', `${barberId}_${date}`);
        const lockSnap = await trx.get(lockRef);
        const booked = lockSnap.exists() ? (lockSnap.data().booked||[]) : [];
        const startMin = timeToMin(time);
        const endMin = startMin + duration;
        const conflict = booked.some(x => startMin < (x.start + x.duration) && endMin > x.start);
        if(conflict) throw new Error('SLOT_TAKEN');

        const apptRef = doc(tCol('appointments'));
        const barberName = (state.barbers.find(x=>x.id===barberId)||{}).name || '';
        trx.set(apptRef, {
          serviceId: service.id, serviceName: service.name, price: service.price, duration,
          barberId, barberName,
          date, time, clientName: name.trim(), clientPhone: phone,
          note: (note||'').trim(), status: 'agendado', createdAt: Timestamp.now(),
          source: source || 'cliente'
        });
        trx.set(lockRef, { booked: [...booked, { start: startMin, duration, apptId: apptRef.id }] }, { merge:true });

        const clientRef = tDoc('clients', phone.replace(/\D/g,'') || apptRef.id);
        trx.set(clientRef, {
          name: name.trim(), phone, lastVisit: date, updatedAt: Timestamp.now(),
          history: arrayUnion({ apptId: apptRef.id, date, time, service: service.name, price: service.price, barberName })
        }, { merge:true });

        newApptId = apptRef.id;
      });
      return { ok:true, barberId, apptId: newApptId };
    }catch(err){
      if(err.message !== 'SLOT_TAKEN'){ console.error(err); }
      continue;
    }
  }
  return { ok:false };
}

async function confirmBooking(){
  const b = state.booking;
  const candidates = (b.barberMode==='specific') ? [b.barber.id] : (b.candidatesByTime[b.time] || []).slice();

  if(candidates.length===0){
    showToast('Não há barbeiro disponível para esse horário. Escolha outro.');
    return;
  }

  const result = await attemptBooking({
    service: b.service, candidates, date: b.date, time: b.time,
    name: b.name, phone: b.phone, note: b.note, source: 'cliente'
  });

  if(!result.ok){
    showToast('Esse horário acabou de ser reservado. Escolha outro.');
    clientStep = 4;
    renderClient();
    return;
  }

  b.confirmedBarberId = result.barberId;
  b._apptId = result.apptId;
  clientStep = 6;
  renderClient();
}

// ---------- INTEGRAÇÃO COM AGENDA DO CELULAR ----------
function icsFmt(d){ return d.toISOString().replace(/[-:]|\.\d{3}/g,''); }
function bookingTimes(){
  const b = state.booking;
  const start = new Date(`${b.date}T${b.time}:00`);
  const end = new Date(start.getTime() + b.service.duration*60000);
  return { start, end };
}
function confirmedBarberName(){
  const b = state.booking;
  return (state.barbers.find(x=>x.id===b.confirmedBarberId)||{}).name || '';
}
function buildGCalUrl(){
  const b = state.booking; const { start, end } = bookingTimes(); const barberName = confirmedBarberName();
  const text = encodeURIComponent(`${b.service.name} — ${state.config.businessName}`);
  const details = encodeURIComponent(`Agendamento em ${state.config.businessName}${barberName?' com '+barberName:''}.`);
  const location = encodeURIComponent(state.config.businessName);
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${icsFmt(start)}/${icsFmt(end)}&details=${details}&location=${location}`;
}
function downloadICS(){
  const b = state.booking; const { start, end } = bookingTimes(); const barberName = confirmedBarberName();
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//BarberAgenda//PT-BR','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    `UID:${b._apptId || Date.now()}@barberagenda`,
    `DTSTAMP:${icsFmt(new Date())}`, `DTSTART:${icsFmt(start)}`, `DTEND:${icsFmt(end)}`,
    `SUMMARY:${b.service.name} — ${state.config.businessName}`,
    `DESCRIPTION:Agendamento em ${state.config.businessName}${barberName?' com '+barberName:''}.`,
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `agendamento-${b.date}-${b.time.replace(':','')}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

    const box = $('#manual-booking-form');

    if(unsubAppts) unsubAppts();
    const list = $('#appt-list');
    list.innerHTML = '<div class="empty-state">Carregando...</div>';
    const q = query(tCol('appointments'), where('date','==', state.admin.selectedDate));
    unsubAppts = onSnapshot(q, snap=>{
      const items = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> a.time.localeCompare(b.time));
      list.innerHTML = '';
      if(items.length===0){ list.innerHTML = '<div class="empty-state"><span class="glyph">📭</span>Nenhum agendamento nesse dia.</div>'; return; }
      items.forEach(a=>{

            <span class="badge ${a.status}">${a.status}</span>
          </div>
          <div class="appt-actions"></div>`;
        const actions = card.querySelector('.appt-actions');
        if(a.status==='agendado'){
          const okBtn = el('button','icon-btn ok','✓');
          okBtn.addEventListener('click', ()=> updateApptStatus(a.id,'concluido', a));
          const cancelBtn = el('button','icon-btn danger','✕');
          cancelBtn.addEventListener('click', ()=> updateApptStatus(a.id,'cancelado', a));
          actions.appendChild(okBtn); actions.appendChild(cancelBtn);
        }
        list.appendChild(card);
      });
    });
  }
}

function renderManualBookingForm(box){
  const mb = { service:null, barberMode:'any', barber:null, date: toDateStr(new Date()), time:null, candidatesByTime:{} };

  box.className = 'card';
  box.innerHTML = `
    <div class="step-title" style="margin-bottom:8px;">Cliente presencial / telefone</div>
    <label class="field-label">Serviço</label>
    <select id="mb-service"><option value="">Selecione...</option>${state.services.map(s=>`<option value="${s.id}">${s.name} — ${money(s.price)}</option>`).join('')}</select>
    <label class="field-label">Barbeiro</label>
    <select id="mb-barber"><option value="any">Qualquer disponível</option></select>
    <label class="field-label">Data</label>
    <input type="date" id="mb-date" value="${mb.date}">
    <label class="field-label">Horário</label>
    <div id="mb-times" class="time-grid" style="margin-top:6px;"><div class="empty-state" style="padding:16px;">Escolha serviço e data.</div></div>
    <label class="field-label">Nome do cliente</label>
    <input type="text" id="mb-name" placeholder="Nome completo">
    <label class="field-label">Celular / WhatsApp</label>
    <input type="tel" id="mb-phone" placeholder="(21) 99999-9999">
    <label class="field-label">Observação (opcional)</label>
    <textarea id="mb-note" rows="2" placeholder="Observação"></textarea>
    <button class="btn btn-primary" id="mb-confirm" style="margin-top:14px;" disabled>Confirmar agendamento</button>`;

  $('#mb-phone').addEventListener('input', e=>{ e.target.value = phoneMask(e.target.value); });

  async function refreshTimes(){
    const timesBox = $('#mb-times');
    if(!mb.service || !mb.date){ timesBox.innerHTML = '<div class="empty-state" style="padding:16px;">Escolha serviço e data.</div>'; return; }
    timesBox.innerHTML = '<div class="empty-state" style="padding:16px;">Carregando...</div>';
    const barberId = (mb.barberMode==='specific') ? mb.barber.id : null;
    const { times, candidatesByTime } = await getAvailableTimesForBooking(mb.service, mb.date, barberId);
    mb.candidatesByTime = candidatesByTime;
    mb.time = null; $('#mb-confirm').disabled = true;
    timesBox.innerHTML = '';
    if(times.length===0){ timesBox.innerHTML = '<div class="empty-state" style="padding:16px;">Sem horários livres nesse dia.</div>'; return; }
    times.forEach(t=>{
      const slot = el('div','time-slot', t);
      slot.addEventListener('click', ()=>{
        mb.time = t;
        timesBox.querySelectorAll('.time-slot').forEach(x=>x.classList.remove('selected'));
        slot.classList.add('selected');
        validate();
      });
      timesBox.appendChild(slot);
    });
  }

  function validate(){
    $('#mb-confirm').disabled = !(mb.service && mb.time && $('#mb-name').value.trim().length>=3 && $('#mb-phone').value.replace(/\D/g,'').length>=10);
  }

  $('#mb-service').addEventListener('change', e=>{
    mb.service = state.services.find(s=>s.id===e.target.value) || null;
    const barberSel = $('#mb-barber');
    barberSel.innerHTML = '<option value="any">Qualquer disponível</option>' +
      barbersForService(mb.service ? mb.service.id : null).map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
    mb.barberMode='any'; mb.barber=null;
    refreshTimes(); validate();
  });
  $('#mb-barber').addEventListener('change', e=>{
    if(e.target.value==='any'){ mb.barberMode='any'; mb.barber=null; }
    else{ mb.barberMode='specific'; mb.barber = state.barbers.find(b=>b.id===e.target.value); }
    refreshTimes();
  });
  $('#mb-date').addEventListener('change', e=>{ mb.date = e.target.value; refreshTimes(); });
  $('#mb-name').addEventListener('input', validate);

  $('#mb-confirm').addEventListener('click', async ()=>{
    const name = $('#mb-name').value.trim();
    const phone = $('#mb-phone').value.trim();
    const note = $('#mb-note').value;
    const candidates = (mb.barberMode==='specific') ? [mb.barber.id] : (mb.candidatesByTime[mb.time] || []).slice();
    if(candidates.length===0){ showToast('Escolha um horário válido.'); return; }
    $('#mb-confirm').disabled = true;
    const result = await attemptBooking({ service: mb.service, candidates, date: mb.date, time: mb.time, name, phone, note, source: 'admin' });
    if(!result.ok){ showToast('Esse horário acabou de ser reservado. Escolha outro.'); refreshTimes(); return; }
    showToast('Agendamento criado.');
    box.innerHTML=''; box.dataset.open='0'; box.className='';
  });
}

// versão de getAvailableTimes que não depende de state.booking (usada pelo ADM)
async function getAvailableTimesForBooking(service, dateStr, barberId){
  const prevService = state.booking.service;
  state.booking.service = service;
  const result = await getAvailableTimes(dateStr, service.duration, barberId);
  state.booking.service = prevService;
  return result;
}

async function updateApptStatus(id, status, appt){
  await updateDoc(tDoc('appointments', id), { status });
  if(status==='cancelado' && appt && appt.barberId){
    const lockRef = tDoc('scheduleLocks', `${appt.barberId}_${appt.date}`);
    await runTransaction(db, async trx=>{
      const snap = await trx.get(lockRef);
      if(!snap.exists()) return;
      const booked = (snap.data().booked||[]).filter(x=>x.apptId!==id);
      trx.set(lockRef, { booked }, { merge:true });
    });
  }
  showToast('Atualizado.');
}

function renderAdminEarnings(panel){
  panel.innerHTML = `
    <div class="period-tabs" id="period-tabs">
      <button data-p="hoje">Hoje</button>
      <button data-p="semana">Semana</button>
      <button data-p="mes">Mês</button>
    </div>
    <div id="earnings-body"></div>`;
  panel.querySelectorAll('#period-tabs button').forEach(b=>{
    if(b.dataset.p===state.admin.earningsPeriod) b.classList.add('active');
    b.addEventListener('click', ()=>{ state.admin.earningsPeriod = b.dataset.p; renderAdminEarnings(panel); });
  });
  loadEarnings();

  async function loadEarnings(){
    const body = $('#earnings-body'); body.innerHTML = '<div class="empty-state">Calculando...</div>';
    const today = new Date();
    let start;
    if(state.admin.earningsPeriod==='hoje') start = new Date(today);
    else if(state.admin.earningsPeriod==='semana'){ start = new Date(today); start.setDate(start.getDate()-6); }
    else { start = new Date(today.getFullYear(), today.getMonth(), 1); }
    const startStr = toDateStr(start);
    const endStr = toDateStr(today);

    const snap = await getDocs(query(tCol('appointments'),
      where('date','>=', startStr), where('date','<=', endStr)));
    const items = snap.docs.map(d=>d.data()).filter(a=>a.status==='concluido');
    const total = items.reduce((s,a)=>s+(a.price||0),0);

    body.innerHTML = `
      <div class="earnings-total">
        <div class="big">${money(total)}</div>
        <div class="lbl">${items.length} atendimento${items.length===1?'':'s'} concluído${items.length===1?'':'s'}</div>
      </div>`;
    const bySvc = {};
    items.forEach(a=>{ bySvc[a.serviceName] = (bySvc[a.serviceName]||0) + a.price; });
    Object.entries(bySvc).sort((a,b)=>b[1]-a[1]).forEach(([name,val])=>{
      const row = el('div','card svc-row');
      row.innerHTML = `<span>${name}</span><strong>${money(val)}</strong>`;
      body.appendChild(row);
    });
  }
}

  }

  $('#block-slot-btn').addEventListener('click', async ()=>{
    const date = $('#block-slot-date').value; const time = $('#block-slot-time').value;
    if(!date || !time) return;
    await addDoc(tCol('blockedSlots'), { date, time });
    showToast('Horário bloqueado.');
    loadBlockedSlots();
    $('#block-slot-date').value=''; $('#block-slot-time').value='';
  });

  async function loadBlockedSlots(){
    const list = $('#blocked-slots-list'); if(!list) return;
    list.innerHTML = '<div class="empty-state">Carregando...</div>';
    const snap = await getDocs(query(tCol('blockedSlots'), orderBy('date')));
    list.innerHTML = '';
    if(snap.empty){ list.innerHTML = '<div class="empty-state">Nenhum horário bloqueado.</div>'; return; }
    snap.docs.forEach(d=>{
      const data = d.data();
      const row = el('div','card block-row');
      row.innerHTML = `<span>${fromDateStr(data.date).toLocaleDateString('pt-BR')} às ${data.time}</span>`;
      const rm = el('button','icon-btn danger','✕');
      rm.addEventListener('click', async ()=>{ await deleteDoc(tDoc('blockedSlots', d.id)); loadBlockedSlots(); });
      row.appendChild(rm);
      list.appendChild(row);
    });
  }
}

function renderAdminHoursIfActive(){
  if(state.route==='admin' && state.admin.tab==='horarios' && state.admin.user){
    const panel = $('#panel-horarios'); if(panel) renderAdminHours(panel);
  }
}

// ==========================================================================
function render(){
  if(!state.tenantSlug){ renderTenantMissing(); return; }
  if(state.route==='admin') renderAdmin();
  else renderClient();
}
routeFromHash();
</script>
</body>
</html>
