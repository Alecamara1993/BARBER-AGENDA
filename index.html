<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Agenda — Agendamento</title>
<link rel="icon" id="favicon-link" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0e12;
    --bg-panel:#161821;
    --bg-panel-2:#1e2029;
    --line:#282b36;
    --text:#f3f4f7;
    --muted:#8b8fa3;
    --accent:#6c63ff;
    --accent-light:#9d97ff;
    --red:#e0666b;
    --green:#5fbf85;
    --radius-lg:20px;
    --radius:14px;
    --radius-sm:10px;
    --display:'Sora', sans-serif;
    --sans:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .stripe{
    height:3px;
    background:linear-gradient(90deg, var(--accent), var(--accent-light));
  }
  .wrap{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg);}
  header.brand{padding:32px 20px 22px; text-align:center; border-bottom:1px solid var(--line);}
  header.brand img{width:56px; height:56px; margin-bottom:12px; border-radius:16px;}
  header.brand .eyebrow{font-size:13px; font-weight:500; color:var(--accent-light);}
  header.brand h1{font-family:var(--display); font-size:26px; font-weight:700; letter-spacing:-.01em; color:var(--text); line-height:1.2; margin-top:4px;}
  header.brand h1 span{color:var(--accent-light);}
  header.brand .sub{font-size:14px; color:var(--muted); margin-top:4px;}

  .steps{display:flex; justify-content:center; gap:6px; padding:18px 20px 0;}
  .step-dot{flex:1; max-width:64px; height:4px; border-radius:4px; background:var(--line); transition:background .3s;}
  .step-dot.active{background:var(--accent);}
  .step-dot.done{background:var(--accent-light);}

  main{flex:1; padding:22px 20px; padding-bottom:110px; animation:fadeUp .35s ease;}
  .step-title{font-size:13px; font-weight:500; color:var(--muted); margin-bottom:4px;}
  .step-heading{font-family:var(--display); font-size:22px; font-weight:700; letter-spacing:-.01em; margin-bottom:20px;}

  .card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:16px;
    margin-bottom:10px;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .svc-card{display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .svc-card:active{transform:scale(.98);}
  .svc-card.selected{border-color:var(--accent); background:var(--bg-panel-2);}
  .svc-main{display:flex; align-items:center; gap:12px;}
  .svc-thumb{width:48px; height:48px; border-radius:var(--radius-sm); object-fit:cover; flex-shrink:0;}
  .svc-name{font-weight:600; font-size:16px;}
  .svc-meta{color:var(--muted); font-size:13px; margin-top:2px;}
  .svc-price{font-family:var(--display); font-weight:700; font-size:17px; color:var(--accent-light);}

  .empty-state{text-align:center; padding:48px 20px; color:var(--muted); font-size:14px;}
  .empty-state .glyph{margin-bottom:10px; display:flex; justify-content:center;}
  .empty-state .glyph svg{width:30px; height:30px; opacity:.6;}

  input[type=date], .date-input{
    width:100%; padding:14px; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:var(--radius); color:var(--text); font-size:16px; font-family:var(--sans);
  }
  .calendar{background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:14px;}
  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .cal-month-label{font-family:var(--display); font-weight:700; font-size:15px;}
  .cal-nav{width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--bg-panel-2); color:var(--text); font-size:16px; cursor:pointer;}
  .cal-nav:disabled{opacity:.3; cursor:not-allowed;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-weekdays{margin-bottom:6px;}
  .cal-weekdays div{text-align:center; color:var(--muted); font-size:11px;}
  .cal-day{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:var(--radius-sm); cursor:pointer; font-size:14px; transition:border-color .15s, background .15s, color .15s;}
  .cal-day:not(.empty):not(.disabled){border:1px solid var(--line);}
  .cal-day.empty{cursor:default;}
  .cal-day.today{color:var(--accent-light); font-weight:700;}
  .cal-day.selected{border-color:var(--accent); background:var(--accent); color:#fff; font-weight:600;}
  .cal-day.disabled{opacity:.25; pointer-events:none;}

  .time-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .time-slot{
    padding:12px 4px; text-align:center; border-radius:999px; background:var(--bg-panel);
    border:1px solid var(--line); cursor:pointer; font-weight:600; font-size:14px; transition:border-color .15s, background .15s, color .15s;
  }
  .time-slot.selected{border-color:var(--accent); background:var(--accent); color:#fff;}

  label.field-label{display:block; font-size:13px; font-weight:500; color:var(--muted); margin:16px 0 6px;}
  input[type=text], input[type=tel], textarea{
    width:100%; padding:14px; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:var(--radius); color:var(--text); font-size:16px; font-family:var(--sans);
  }
  input:focus, textarea:focus{outline:none; border-color:var(--accent);}

  .summary-box{background:var(--bg-panel-2); border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px; margin-top:18px;}
  .summary-row{display:flex; justify-content:space-between; font-size:14px; padding:5px 0; color:var(--muted);}
  .summary-row strong{color:var(--text); font-weight:600;}

  .bottom-bar{
    position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto;
    background:linear-gradient(0deg, var(--bg) 65%, transparent); padding:20px; padding-top:40px;
  }
  .btn{
    display:block; width:100%; text-align:center; padding:15px; border-radius:var(--radius);
    font-family:var(--sans); font-weight:600; font-size:15px; border:none; cursor:pointer; transition:opacity .15s, transform .1s;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:disabled{background:var(--line); color:var(--muted); cursor:not-allowed;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--text); margin-top:8px;}
  .btn-link{background:none; border:none; color:var(--accent-light); font-family:var(--sans); font-size:13px; text-decoration:underline; cursor:pointer;}
  .back-row{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .back-btn{color:var(--muted); font-size:14px; cursor:pointer; background:none; border:none;}

  .confirm-screen{text-align:center; padding:48px 20px;}
  .confirm-screen .glyph{width:56px; height:56px; margin:0 auto; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--bg-panel-2); border:1px solid var(--accent); color:var(--accent-light); font-family:var(--display); font-size:24px;}
  .confirm-screen h2{font-family:var(--display); font-weight:700; font-size:22px; margin:16px 0 8px;}
  .confirm-screen p{color:var(--muted); font-size:14px; line-height:1.6;}

  footer.foot{text-align:center; padding:18px; color:var(--muted); font-size:12px;}
  footer.foot button{background:none; border:none; color:var(--muted); font-size:12px; text-decoration:underline; cursor:pointer;}

  /* ---------- ADMIN ---------- */
  .admin-wrap{max-width:720px;}
  .login-box{max-width:360px; margin:80px auto; padding:0 20px;}
  .login-box h2{font-family:var(--display); font-weight:700; font-size:24px; text-align:center; margin-bottom:20px;}
  .admin-header{display:flex; justify-content:space-between; align-items:center; padding:20px; border-bottom:1px solid var(--line);}
  .admin-header h1{font-family:var(--display); font-weight:700; font-size:19px;}
  .logout-btn{color:var(--muted); font-size:12px; background:none; border:none; text-decoration:underline; cursor:pointer;}
  .tabs{display:flex; gap:4px; padding:14px 20px 0; overflow-x:auto;}
  .tab{padding:10px 14px; font-size:13px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; transition:color .15s, border-color .15s;}
  .tab.active{color:var(--accent-light); border-color:var(--accent);}
  .tab-panel{padding:18px 20px 60px; display:none;}
  .tab-panel.active{display:block;}

  .appt-card{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .appt-time{font-family:var(--display); font-weight:700; font-size:17px; color:var(--accent-light); min-width:52px;}
  .appt-info{flex:1;}
  .appt-info .name{font-weight:600;}
  .appt-info .meta{color:var(--muted); font-size:12px; margin-top:2px;}
  .badge{font-size:10px; padding:4px 9px; border-radius:999px; font-weight:700;}
  .badge.agendado{background:#2c2a45; color:var(--accent-light);}
  .badge.concluido{background:#1f3a2c; color:var(--green);}
  .badge.cancelado{background:#3a2226; color:var(--red);}
  .badge.pay{background:#232a1f; color:#c9d98a;}
  .badge-row{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .appt-actions{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .icon-btn{display:inline-flex; align-items:center; justify-content:center; padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg-panel-2); color:var(--text); font-size:12px; cursor:pointer; transition:border-color .15s, background .15s;}
  .icon-btn.danger{border-color:var(--red); color:#f0a3a6;}
  .icon-btn.ok{border-color:var(--green); color:#a7e0bc;}
  .icon-btn.edit{border-color:var(--accent); color:var(--accent-light);}
  .appt-edit-form{display:flex; gap:8px; width:100%; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);}
  .appt-edit-form input{flex:1;}

  .modal-overlay{position:fixed; inset:0; background:rgba(8,9,13,.72); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; animation:fadeUp .2s ease;}
  .modal-box{background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px; width:100%; max-width:340px;}
  .modal-box h3{font-family:var(--display); font-weight:700; font-size:16px; text-align:center; margin-bottom:4px;}
  .modal-box .modal-sub{color:var(--muted); font-size:12px; text-align:center; margin-bottom:16px;}
  .pay-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .pay-opt{padding:16px 8px; border-radius:var(--radius); border:1px solid var(--line); background:var(--bg-panel-2); color:var(--text); font-weight:600; font-size:13px; cursor:pointer; transition:border-color .15s, transform .1s;}
  .pay-opt:active{transform:scale(.97);}
  .pay-opt:hover{border-color:var(--pm-color, var(--accent)); color:var(--pm-color, var(--accent-light));}

  .earnings-total{text-align:center; padding:26px 0 18px;}
  .earnings-total .big{font-family:var(--display); font-weight:700; font-size:38px; color:var(--accent-light);}
  .earnings-total .lbl{color:var(--muted); font-size:12px; margin-top:4px;}
  .earnings-stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .stat-box{background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; text-align:center;}
  .stat-val{font-family:var(--display); font-weight:700; font-size:18px;}
  .stat-lbl{color:var(--muted); font-size:11px; margin-top:2px;}
  .earnings-section{margin-top:26px;}
  .earnings-section .section-title{font-size:13px; font-weight:600; color:var(--muted); margin-bottom:12px; text-transform:uppercase; letter-spacing:.02em;}
  .pay-bar-row{margin-bottom:14px;}
  .pay-bar-top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;}
  .pay-bar-top strong{font-weight:700;}
  .pay-bar-track{height:6px; border-radius:999px; background:var(--bg-panel-2); overflow:hidden;}
  .pay-bar-fill{height:100%; border-radius:999px; transition:width .3s ease;}
  .period-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .period-tabs button{flex:1; padding:10px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg-panel); color:var(--muted); font-size:13px; cursor:pointer; transition:border-color .15s, color .15s;}
  .period-tabs button.active{border-color:var(--accent); color:var(--accent-light);}

  .svc-row-main{display:flex; align-items:center; gap:10px;}
  .svc-thumb-edit{position:relative; width:44px; height:44px; border-radius:var(--radius-sm); overflow:hidden; cursor:pointer;
    flex-shrink:0; background:var(--bg-panel-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted);}
  .svc-thumb-edit img{width:100%; height:100%; object-fit:cover;}
  .svc-thumb-edit svg{width:18px; height:18px;}
  .svc-thumb-edit input[type=file]{display:none;}
  .svc-thumb-remove{position:absolute; top:-4px; right:-4px; width:16px; height:16px; border-radius:50%; background:var(--red);
    color:#fff; font-size:10px; line-height:1; display:flex; align-items:center; justify-content:center; border:none; cursor:pointer;}

  .svc-row, .hour-row, .block-row{display:flex; align-items:center; gap:10px; justify-content:space-between;}
  .hour-row{padding:12px 0; border-bottom:1px solid var(--line);}
  .hour-row .dow-label{width:76px; font-weight:600; font-size:14px;}
  .hour-row input[type=time]{background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text); border-radius:var(--radius-sm); padding:8px; font-size:13px;}
  .hour-row label.closed-toggle{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted);}

  .form-inline{display:flex; gap:8px; margin-top:10px;}
  .form-inline input{flex:1;}
  .small-btn{padding:12px 16px; border-radius:var(--radius-sm); background:var(--accent); color:#fff; border:none; font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--bg-panel-2); color:var(--text); border:1px solid var(--accent);
    padding:12px 20px; border-radius:var(--radius); font-weight:600; font-size:14px; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  ::-webkit-scrollbar{display:none;}
  @media (prefers-reduced-motion: reduce){ main{animation:none;} }
</style>
</head>

<script type="module">
/* =========================================================================
   AGENDA — Sistema de Agendamento (SaaS multi-segmento)
   Firebase Firestore + Auth. Config abaixo: cole as chaves do seu projeto.

// ---------- CONFIGURAÇÃO FIREBASE (cole aqui suas chaves) ----------
const firebaseConfig = {
  apiKey: "AIzaSyAxdSvWBLfbTunb-8lW0hUY1D9OIQLX71g",
  authDomain: "barber-agenda-53c9d.firebaseapp.com",
  projectId: "barber-agenda-53c9d",
  storageBucket: "barber-agenda-53c9d.firebasestorage.app",
  messagingSenderId: "167143504123",
  appId: "1:167143504123:web:ea2ff6554a8db9e78cd85e"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc,
  query, where, orderBy, onSnapshot, writeBatch, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const DEFAULT_LOGO_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="46" fill="#161821" stroke="#6c63ff" stroke-width="3"/>
  <circle cx="50" cy="50" r="15" fill="#6c63ff"/>
  <circle cx="50" cy="25" r="5" fill="#9d97ff"/>
</svg>
`.trim());

// Ícones neutros usados em estados vazios (funcionam para qualquer segmento)
const ICON_LIST = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="8" y1="7" x2="20" y2="7"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="17" x2="20" y2="17"/><line x1="4" y1="7" x2="4" y2="7"/><line x1="4" y1="12" x2="4" y2="12"/><line x1="4" y1="17" x2="4" y2="17"/></svg>`;
const ICON_CALENDAR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><line x1="3.5" y1="10" x2="20.5" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>`;
const ICON_INBOX = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h4l2 3h4l2-3h4"/><path d="M5.5 5h13l2 7v7a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3.5 19v-7z"/></svg>`;
const ICON_CAMERA = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
const ICON_EDIT = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
const ICON_TRASH = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>`;

// ---------- FORMAS DE PAGAMENTO ----------
const PAYMENT_METHODS = [
  { key:'pix', label:'Pix', color:'#5fbf85' },
  { key:'dinheiro', label:'Dinheiro', color:'#e8b954' },
  { key:'debito', label:'Cartão Débito', color:'#6c63ff' },
  { key:'credito', label:'Cartão Crédito', color:'#9d97ff' },
];
const PAYMENT_LABELS = Object.fromEntries(PAYMENT_METHODS.map(p=>[p.key, p.label]));
const PAYMENT_COLORS = Object.fromEntries(PAYMENT_METHODS.map(p=>[p.key, p.color]));

// ---------- CONSTANTES ----------
const DOW_KEYS = ['dom','seg','ter','qua','qui','sex','sab'];
const DOW_LABELS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DEFAULT_HOURS = DOW_KEYS.reduce((acc,k)=>{ acc[k] = {open:"09:00", close:"19:00", closed:false}; return acc; }, {});
const SLOT_STEP = 30; // minutos

// ---------- HELPERS ----------
const $ = (sel, ctx=document) => ctx.querySelector(sel);
const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html!==undefined) e.innerHTML = html; return e; };
const pad = n => String(n).padStart(2,'0');
const toDateStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromDateStr = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const monthLabel = d => { const s = d.toLocaleDateString('pt-BR', {month:'long', year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); };
const timeToMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const minToTime = min => `${pad(Math.floor(min/60))}:${pad(min%60)}`;
const money = v => v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const showToast = msg => {
  const root = $('#toast-root'); root.innerHTML = '';
  const t = el('div','toast', msg); root.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2600);
};
function openPaymentModal(onSelect){
  const overlay = el('div','modal-overlay');
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Concluir atendimento</h3>
      <div class="modal-sub">Como o cliente pagou?</div>
      <div class="pay-grid" id="pay-grid"></div>
      <button class="btn btn-ghost" id="pay-cancel">Cancelar</button>
    </div>`;
  const grid = overlay.querySelector('#pay-grid');
  PAYMENT_METHODS.forEach(pm=>{

}
function fileToCompressedDataURL(file, maxSize=320, quality=0.85){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
        else{ if(h > maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png', quality));
      };
      img.onerror = () => reject(new Error('invalid image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}
const phoneMask = v => {
  v = v.replace(/\D/g,'').slice(0,11);
  if(v.length > 6) return `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
  if(v.length > 2) return `(${v.slice(0,2)}) ${v.slice(2)}`;
  return v;
};

async function getAvailableTimes(dateStr, duration){
  const d = fromDateStr(dateStr);
  const dow = DOW_KEYS[d.getDay()];
  const hours = state.config.hours[dow];
  if(!hours || hours.closed) return [];
  if(state.config.blockedDates.includes(dateStr)) return [];

  const openMin = timeToMin(hours.open);
  const closeMin = timeToMin(hours.close);

  // horários ocupados por agendamentos existentes (via coleção pública 'slots')
  const slotsSnap = await getDocs(query(collection(db,'slots'), where('date','==', dateStr)));
  const busyRanges = slotsSnap.docs.map(d=>{
    const s = d.data();
    const start = timeToMin(s.time);
    return [start, start + (s.duration||30)];
  });

  // horários bloqueados manualmente pelo admin
  const blockedSnap = await getDocs(query(collection(db,'blockedSlots'), where('date','==', dateStr)));
  const blockedTimes = new Set(blockedSnap.docs.map(d=>d.data().time));

  const now = new Date();
  const isToday = dateStr === toDateStr(now);
  const nowMin = now.getHours()*60 + now.getMinutes() + 30; // buffer de 30min

  const slots = [];
  for(let t=openMin; t + duration <= closeMin; t += SLOT_STEP){
    const time = minToTime(t);
    if(blockedTimes.has(time)) continue;
    if(isToday && t < nowMin) continue;
    const overlaps = busyRanges.some(([s,e]) => t < e && (t+duration) > s);
    if(overlaps) continue;
    slots.push(time);
  }
  return slots;
}

let calMonthOffset = 0; // 0 = mês atual; navegação da agenda no passo 2

function renderStepDate(main){
  const bar = el('div','back-row');
  bar.innerHTML = `<button class="back-btn">&larr; Voltar</button>`;
  bar.querySelector('button').addEventListener('click', ()=>{ clientStep=1; calMonthOffset=0; renderClient(); });
  main.appendChild(bar);

  main.appendChild(el('div','step-title','Passo 2 de 4'));
  main.appendChild(el('div','step-heading','Escolha a data'));

  const today = new Date();
  const todayStr = toDateStr(today);
  const viewDate = new Date(today.getFullYear(), today.getMonth() + calMonthOffset, 1);

  const cal = el('div','calendar');

  const header = el('div','cal-header');
  const prevBtn = el('button','cal-nav','&lsaquo;');
  prevBtn.disabled = calMonthOffset<=0;
  prevBtn.addEventListener('click', ()=>{ calMonthOffset--; renderClient(); });
  const label = el('div','cal-month-label', monthLabel(viewDate));
  const nextBtn = el('button','cal-nav','&rsaquo;');
  nextBtn.addEventListener('click', ()=>{ calMonthOffset++; renderClient(); });
  header.appendChild(prevBtn); header.appendChild(label); header.appendChild(nextBtn);
  cal.appendChild(header);

  const weekdays = el('div','cal-grid cal-weekdays');
  DOW_LABELS.forEach(l=> weekdays.appendChild(el('div','', l)));
  cal.appendChild(weekdays);

  const days = el('div','cal-grid cal-days');
  const firstWeekday = viewDate.getDay();
  for(let i=0;i<firstWeekday;i++) days.appendChild(el('div','cal-day empty'));

  const totalDays = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0).getDate();
  for(let day=1; day<=totalDays; day++){
    const d = new Date(viewDate.getFullYear(), viewDate.getMonth(), day);
    const ds = toDateStr(d);
    const dow = DOW_KEYS[d.getDay()];
    const closed = state.config.hours[dow]?.closed || state.config.blockedDates.includes(ds);
    const isPast = ds < todayStr;
    const disabled = closed || isPast;
    const cell = el('div', `cal-day ${disabled?'disabled':''} ${ds===todayStr?'today':''} ${state.booking.date===ds?'selected':''}`, String(day));
    if(!disabled){
      cell.addEventListener('click', ()=>{
        state.booking.date = ds;
        clientStep = 3;
        renderClient();
      });
    }
    days.appendChild(cell);
  }
  cal.appendChild(days);
  main.appendChild(cal);
}

async function confirmBooking(){

      serviceId: b.service.id, serviceName: b.service.name, price: b.service.price, duration: b.service.duration,
      date: b.date, time: b.time, clientName: b.name.trim(), clientPhone: b.phone,
      note: b.note.trim(), status: 'agendado', createdAt: Timestamp.now()
    });
    const slotRef = doc(collection(db,'slots'));
    batch.set(slotRef, { date: b.date, time: b.time, duration: b.service.duration, apptId: apptRef.id });
    await batch.commit();
    clientStep = 5;
    renderClient();
  }catch(err){

  }

function renderAdminAppointments(panel){

          actions.appendChild(okBtn); actions.appendChild(cancelBtn);

function toggleEditForm(card, a){
  const existing = card.querySelector('.appt-edit-form');
  if(existing){ existing.remove(); return; }
  const form = el('div','appt-edit-form');
  form.innerHTML = `
    <input type="date" class="edit-date" value="${a.date}">
    <input type="time" class="edit-time" value="${a.time}">
    <button class="small-btn edit-save">Salvar</button>`;
  form.querySelector('.edit-save').addEventListener('click', async ()=>{
    const newDate = form.querySelector('.edit-date').value;
    const newTime = form.querySelector('.edit-time').value;
    if(!newDate || !newTime){ showToast('Preencha data e horário.'); return; }
    await editAppointment(a.id, newDate, newTime);
    form.remove();
  });
  card.appendChild(form);
}

async function editAppointment(id, newDate, newTime){
  await updateDoc(doc(db,'appointments', id), { date:newDate, time:newTime });
  const slotSnap = await getDocs(query(collection(db,'slots'), where('apptId','==', id)));
  await Promise.all(slotSnap.docs.map(d=> updateDoc(doc(db,'slots', d.id), { date:newDate, time:newTime })));
  showToast('Horário atualizado.');
}

async function deleteAppointment(id){
  if(!confirm('Excluir este agendamento definitivamente? Essa ação não pode ser desfeita.')) return;
  const slotSnap = await getDocs(query(collection(db,'slots'), where('apptId','==', id)));
  await Promise.all(slotSnap.docs.map(d=> deleteDoc(doc(db,'slots', d.id))));
  await deleteDoc(doc(db,'appointments', id));
  showToast('Agendamento excluído.');
}

async function updateApptStatus(id, status, date, time, paymentMethod){
  try{
    await updateDoc(doc(db,'appointments',id), { status });
  }catch(err){
    console.error('Falha ao atualizar status:', err);
    showToast('Erro ao atualizar status. Verifique as regras do Firestore.');
    return;
  }
  if(status==='concluido' && paymentMethod){
    try{
      await updateDoc(doc(db,'appointments',id), { paymentMethod });
    }catch(err){
      console.error('Falha ao salvar forma de pagamento:', err);
      showToast('Concluído, mas a forma de pagamento não foi salva.');
    }
  }
  if(status==='cancelado' && date && time){
    const slotSnap = await getDocs(query(collection(db,'slots'), where('apptId','==', id)));
    slotSnap.docs.forEach(d=> deleteDoc(doc(db,'slots', d.id)));
  }
  showToast('Atualizado.');
}

    <div id="earnings-body"></div>`;
  panel.querySelectorAll('#period-tabs button').forEach(b=>{
    if(b.dataset.p===state.admin.earningsPeriod) b.classList.add('active');
    b.addEventListener('click', ()=>{ state.admin.earningsPeriod = b.dataset.p; renderAdminEarnings(panel); });
  });
  subscribeEarnings();

  function subscribeEarnings(){
    if(unsubEarnings) unsubEarnings();
    const body = $('#earnings-body'); body.innerHTML = '<div class="empty-state">Calculando...</div>';
    const today = new Date();
    let start;
    if(state.admin.earningsPeriod==='hoje') start = new Date(today);
    else if(state.admin.earningsPeriod==='semana'){ start = new Date(today); start.setDate(start.getDate()-6); }
    else { start = new Date(today.getFullYear(), today.getMonth(), 1); }
    const startStr = toDateStr(start);
    const endStr = toDateStr(today);

    const q = query(collection(db,'appointments'), where('date','>=', startStr), where('date','<=', endStr));
    unsubEarnings = onSnapshot(q, snap=>{
      const items = snap.docs.map(d=>d.data()).filter(a=>a.status==='concluido');
      renderEarningsBody(body, items);
    }, err=>{
      console.error('Erro ao carregar ganhos:', err);
      body.innerHTML = `<div class="empty-state">Erro ao carregar ganhos: ${err.code || err.message}</div>`;
    });
  }
}

function renderEarningsBody(body, items){
  const total = items.reduce((s,a)=>s+(a.price||0),0);
  const avgTicket = items.length ? total/items.length : 0;

  body.innerHTML = `
    <div class="earnings-total">
      <div class="big">${money(total)}</div>
      <div class="lbl">${items.length} atendimento${items.length===1?'':'s'} concluído${items.length===1?'':'s'}</div>
    </div>
    <div class="earnings-stats">
      <div class="stat-box"><div class="stat-val">${money(avgTicket)}</div><div class="stat-lbl">Ticket médio</div></div>
      <div class="stat-box"><div class="stat-val">${items.length}</div><div class="stat-lbl">Atendimentos</div></div>
    </div>`;

  if(items.length===0) return;

  // Por forma de pagamento
  const byPay = {};
  items.forEach(a=>{ const k = a.paymentMethod || 'nao_informado'; byPay[k] = (byPay[k]||0) + a.price; });
  const paySection = el('div','earnings-section');
  paySection.innerHTML = `<div class="section-title">Por forma de pagamento</div>`;
  Object.entries(byPay).sort((a,b)=>b[1]-a[1]).forEach(([key,val])=>{
    const pct = total ? Math.round(val/total*100) : 0;
    const label = PAYMENT_LABELS[key] || 'Não informado';
    const color = PAYMENT_COLORS[key] || 'var(--muted)';
    const row = el('div','pay-bar-row');
    row.innerHTML = `
      <div class="pay-bar-top"><span>${label}</span><strong>${money(val)} &middot; ${pct}%</strong></div>
      <div class="pay-bar-track"><div class="pay-bar-fill" style="width:${pct}%; background:${color};"></div></div>`;
    paySection.appendChild(row);
  });
  body.appendChild(paySection);

  // Por serviço
  const bySvc = {};
  items.forEach(a=>{ bySvc[a.serviceName] = (bySvc[a.serviceName]||0) + a.price; });
  const svcSection = el('div','earnings-section');
  svcSection.innerHTML = `<div class="section-title">Por serviço</div>`;
  Object.entries(bySvc).sort((a,b)=>b[1]-a[1]).forEach(([name,val])=>{
    const row = el('div','card svc-row');
    row.innerHTML = `<span>${name}</span><strong>${money(val)}</strong>`;
    svcSection.appendChild(row);
  });
  body.appendChild(svcSection);
}

// ----- Serviços -----
function renderAdminServices(panel){
  panel.innerHTML = `<div id="svc-list"></div>
    <div class="form-inline" style="margin-top:16px; flex-wrap:wrap;">
      <input type="text" id="new-svc-name" placeholder="Nome do serviço" style="flex:1 1 100%; margin-bottom:8px;">
      <input type="text" id="new-svc-price" placeholder="Preço (ex: 45)" style="flex:1;">
      <input type="text" id="new-svc-duration" placeholder="Min." style="flex:1;">
    </div>
    <div style="display:flex; align-items:center; gap:12px; margin-top:10px;">
      <div class="svc-thumb-edit" id="new-svc-thumb">${ICON_CAMERA}</div>
      <span style="font-size:12px; color:var(--muted);">Foto do serviço (opcional) &mdash; o cliente vê na hora de escolher.</span>
    </div>
    <button class="btn btn-primary" id="add-svc-btn" style="margin-top:14px;">Adicionar serviço</button>`;

  let pendingSvcPhoto = null;
  const newThumb = $('#new-svc-thumb');
  const newPhotoInput = document.createElement('input');
  newPhotoInput.type = 'file'; newPhotoInput.accept = 'image/*';
  newThumb.appendChild(newPhotoInput);
  newThumb.addEventListener('click', ()=> newPhotoInput.click());
  newPhotoInput.addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    if(file.size > 5*1024*1024){ showToast('Imagem muito grande (máx. 5MB).'); return; }
    try{
      pendingSvcPhoto = await fileToCompressedDataURL(file, 320, 0.85);
      newThumb.innerHTML = `<img src="${pendingSvcPhoto}" alt="">`;
      newThumb.appendChild(newPhotoInput);
    }catch(err){ showToast('Não foi possível ler a imagem.'); }
  });

  renderList();

  function renderList(){
    const list = $('#svc-list'); list.innerHTML = '';
    if(state.services.length===0) list.innerHTML = '<div class="empty-state">Nenhum serviço cadastrado.</div>';
    state.services.forEach(svc=>{
      const row = el('div','card svc-row');

      const left = el('div','svc-row-main');
      const thumb = el('div','svc-thumb-edit', svc.photo ? `<img src="${svc.photo}" alt="">` : ICON_CAMERA);
      const photoInput = document.createElement('input');
      photoInput.type = 'file'; photoInput.accept = 'image/*';
      thumb.appendChild(photoInput);
      thumb.addEventListener('click', ()=> photoInput.click());
      photoInput.addEventListener('change', async e=>{
        const file = e.target.files[0]; if(!file) return;
        if(file.size > 5*1024*1024){ showToast('Imagem muito grande (máx. 5MB).'); return; }
        try{
          const dataUrl = await fileToCompressedDataURL(file, 320, 0.85);
          await updateDoc(doc(db,'services',svc.id), { photo: dataUrl });
          showToast('Foto atualizada.');
        }catch(err){ showToast('Não foi possível ler a imagem.'); }
      });
      if(svc.photo){
        const rmBtn = el('button','svc-thumb-remove','✕');
        rmBtn.addEventListener('click', async ev=>{
          ev.stopPropagation();
          await updateDoc(doc(db,'services',svc.id), { photo: null });
          showToast('Foto removida.');
        });
        thumb.appendChild(rmBtn);
      }
      left.appendChild(thumb);
      left.appendChild(el('span','', `${svc.name} &middot; ${svc.duration}min`));
      row.appendChild(left);

      const right = el('div'); right.style.display='flex'; right.style.gap='8px'; right.style.alignItems='center';
      right.innerHTML = `<strong>${money(svc.price)}</strong>`;
      const delBtn = el('button','icon-btn danger','✕');
      delBtn.addEventListener('click', async ()=>{ await deleteDoc(doc(db,'services',svc.id)); showToast('Serviço removido.'); });
      right.appendChild(delBtn);
      row.appendChild(right);
      list.appendChild(row);
    });
  }

  $('#add-svc-btn').addEventListener('click', async ()=>{
    const name = $('#new-svc-name').value.trim();
    const price = parseFloat($('#new-svc-price').value.replace(',','.'));
    const duration = parseInt($('#new-svc-duration').value);
    if(!name || isNaN(price) || isNaN(duration)){ showToast('Preencha todos os campos.'); return; }
    await addDoc(collection(db,'services'), { name, price, duration, photo: pendingSvcPhoto, order: state.services.length });
    $('#new-svc-name').value=''; $('#new-svc-price').value=''; $('#new-svc-duration').value='';
    pendingSvcPhoto = null;
    newThumb.innerHTML = ICON_CAMERA;
    newThumb.appendChild(newPhotoInput);
    showToast('Serviço adicionado.');
  });
}

function renderAdminServicesIfActive(){
  if(state.route==='admin' && state.admin.tab==='servicos' && state.admin.user){
    const panel = $('#panel-servicos'); if(panel) renderAdminServices(panel);
  }
}

// ----- Horários -----
function renderAdminHours(panel){
  panel.innerHTML = `
    <div class="step-title" style="margin-bottom:8px;">Identidade do negócio</div>
    <label class="field-label">Nome do negócio</label>
    <input type="text" id="biz-name-input" value="${state.config.businessName}" placeholder="Ex: nome do seu negócio">
    <label class="field-label">Logo (aparece na tela inicial dos clientes)</label>
    <div style="display:flex; align-items:center; gap:14px; margin-top:6px;">
      <img id="logo-preview" src="${state.config.logo || DEFAULT_LOGO_SVG}" alt="Logo" style="width:60px; height:60px; border-radius:12px; border:1px solid var(--line); object-fit:cover;">
      <input type="file" id="logo-file-input" accept="image/*" style="flex:1; font-size:12px;">
    </div>
    <button class="btn btn-primary" id="save-identity-btn" style="margin-top:14px;">Salvar identidade</button>

    <div class="step-title" style="margin-top:32px; margin-bottom:8px;">Funcionamento semanal</div>
    <div id="hours-list"></div>
    <button class="btn btn-primary" id="save-hours-btn" style="margin-top:16px;">Salvar horários</button>

    <div class="step-title" style="margin-top:28px;">Bloquear um dia inteiro</div>
    <div class="form-inline">
      <input type="date" id="block-date-input">
      <button class="small-btn" id="block-date-btn">Bloquear</button>
    </div>
    <div id="blocked-dates-list" style="margin-top:10px;"></div>

    <div class="step-title" style="margin-top:28px;">Bloquear um horário específico</div>
    <div class="form-inline">
      <input type="date" id="block-slot-date">
      <input type="time" id="block-slot-time">
      <button class="small-btn" id="block-slot-btn">Bloquear</button>
    </div>
    <div id="blocked-slots-list" style="margin-top:10px;"></div>`;

  let pendingLogo = state.config.logo || null;
  $('#logo-file-input').addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 5*1024*1024){ showToast('Imagem muito grande (máx. 5MB).'); return; }
    try{
      pendingLogo = await fileToCompressedDataURL(file, 320, 0.85);
      $('#logo-preview').src = pendingLogo;
    }catch(err){ showToast('Não foi possível ler a imagem.'); }
  });

  $('#save-identity-btn').addEventListener('click', async ()=>{
    const businessName = $('#biz-name-input').value.trim() || 'Agenda';
    await setDoc(doc(db,'config','business'), {
      businessName, logo: pendingLogo,
      hours: state.config.hours, blockedDates: state.config.blockedDates
    }, { merge:true });
    showToast('Identidade salva.');
  });

  const hoursList = $('#hours-list');
  DOW_KEYS.forEach((k,i)=>{
    const h = state.config.hours[k] || DEFAULT_HOURS[k];
    const row = el('div','hour-row');
    row.innerHTML = `
      <span class="dow-label">${DOW_LABELS[i]}</span>
      <input type="time" data-k="${k}" data-f="open" value="${h.open}" ${h.closed?'disabled':''}>
      <span>às</span>
      <input type="time" data-k="${k}" data-f="close" value="${h.close}" ${h.closed?'disabled':''}>
      <label class="closed-toggle"><input type="checkbox" data-k="${k}" data-f="closed" ${h.closed?'checked':''}> Fechado</label>`;
    hoursList.appendChild(row);
  });
  hoursList.addEventListener('change', e=>{
    const t = e.target; const k = t.dataset.k; if(!k) return;
    if(t.dataset.f==='closed'){
      const row = t.closest('.hour-row');
      row.querySelectorAll('input[type=time]').forEach(i=> i.disabled = t.checked);
    }
  });

  $('#save-hours-btn').addEventListener('click', async ()=>{
    const newHours = {};
    DOW_KEYS.forEach(k=>{
      const open = hoursList.querySelector(`input[data-k="${k}"][data-f="open"]`).value;
      const close = hoursList.querySelector(`input[data-k="${k}"][data-f="close"]`).value;
      const closed = hoursList.querySelector(`input[data-k="${k}"][data-f="closed"]`).checked;
      newHours[k] = { open, close, closed };
    });
    await setDoc(doc(db,'config','business'), { hours: newHours, blockedDates: state.config.blockedDates }, { merge:true });
    showToast('Horários salvos.');
  });

  $('#block-date-btn').addEventListener('click', async ()=>{
    const val = $('#block-date-input').value; if(!val) return;
    const updated = Array.from(new Set([...state.config.blockedDates, val]));
    await setDoc(doc(db,'config','business'), { hours: state.config.hours, blockedDates: updated }, { merge:true });
    showToast('Dia bloqueado.');
  });

  renderBlockedDates();
  loadBlockedSlots();

  function renderBlockedDates(){
    const list = $('#blocked-dates-list'); list.innerHTML='';
    state.config.blockedDates.forEach(ds=>{
      const row = el('div','card block-row');
      row.innerHTML = `<span>${fromDateStr(ds).toLocaleDateString('pt-BR')}</span>`;
      const rm = el('button','icon-btn danger','✕');
      rm.addEventListener('click', async ()=>{
        const updated = state.config.blockedDates.filter(x=>x!==ds);
        await setDoc(doc(db,'config','business'), { hours: state.config.hours, blockedDates: updated }, { merge:true });
        showToast('Bloqueio removido.');
      });
      row.appendChild(rm);
      list.appendChild(row);
    });
  }

  $('#block-slot-btn').addEventListener('click', async ()=>{
    const date = $('#block-slot-date').value; const time = $('#block-slot-time').value;
    if(!date || !time) return;
    await addDoc(collection(db,'blockedSlots'), { date, time });
    showToast('Horário bloqueado.');
    loadBlockedSlots();
    $('#block-slot-date').value=''; $('#block-slot-time').value='';
  });

  async function loadBlockedSlots(){
    const list = $('#blocked-slots-list'); if(!list) return;
    list.innerHTML = '<div class="empty-state">Carregando...</div>';
    const snap = await getDocs(query(collection(db,'blockedSlots'), orderBy('date')));
    list.innerHTML = '';
    if(snap.empty){ list.innerHTML = '<div class="empty-state">Nenhum horário bloqueado.</div>'; return; }
    snap.docs.forEach(d=>{
      const data = d.data();
      const row = el('div','card block-row');
      row.innerHTML = `<span>${fromDateStr(data.date).toLocaleDateString('pt-BR')} às ${data.time}</span>`;
      const rm = el('button','icon-btn danger','✕');
      rm.addEventListener('click', async ()=>{ await deleteDoc(doc(db,'blockedSlots', d.id)); loadBlockedSlots(); });
      row.appendChild(rm);
      list.appendChild(row);
    });
  }
}

function renderAdminHoursIfActive(){
  if(state.route==='admin' && state.admin.tab==='horarios' && state.admin.user){
    const panel = $('#panel-horarios'); if(panel) renderAdminHours(panel);
  }
}

// ==========================================================================
function render(){
  if(state.route==='admin') renderAdmin();
  else renderClient();
}
render();
</script>
